<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Apexify</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-body">
    <div class="auth-container" style="max-width: 400px; margin: 40px auto; padding: 25px; background: white; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">
        <div style="text-align: center; margin-bottom: 20px;">
            <img src="images/logo.png" alt="Apexify Logo" style="max-width: 100px; height: auto; margin-bottom: 10px;">
            <h2>Welcome Back!</h2>
            <p style="color: #6B7280; font-size: 14px;">Please login to your account</p>
        </div>
        <form id="loginForm">
            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-weight: 500;">Email</label>
                <input type="email" id="email" required style="width: 100%; padding: 10px; border: 1px solid #D1D5DB; border-radius: 5px; box-sizing: border-box;">
            </div>
            <div style="margin-bottom: 20px;">
                <label style="display: block; margin-bottom: 5px; font-weight: 500;">Password</label>
                <input type="password" id="password" required style="width: 100%; padding: 10px; border: 1px solid #D1D5DB; border-radius: 5px; box-sizing: border-box;">
            </div>
            <button type="submit" style="width: 100%; padding: 12px; background-color: #4F46E5; color: white; border: none; border-radius: 5px; font-weight: bold; font-size: 16px; cursor: pointer;">Login</button>
        </form>
        <p style="text-align: center; margin-top: 15px; font-size: 14px;">Don't have an account? <a href="register.html" style="color: #4F46E5; text-decoration: none; font-weight: bold;">Register</a></p>
    </div>
    <script type="module" src="js/login.js"></script>
</body>
        </html>

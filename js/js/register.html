<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Apexify</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-body">
    <div class="auth-container">
        <div class="auth-header">
            <h2>Create Account</h2>
            <p>Join Apexify & Start Earning</p>
        </div>

        <form id="registerForm" class="auth-form">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="regName" required placeholder="Enter your name">
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="regEmail" required placeholder="Enter your email">
            </div>
            <div class="form-group">
                <label>Phone Number</label>
                <input type="text" id="regPhone" required placeholder="Enter phone number">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="regPassword" required placeholder="Create password">
            </div>
            <div class="form-group">
                <label>Referral Code (Optional)</label>
                <input type="text" id="regReferral" placeholder="Auto-filled from link if any">
            </div>
            <button type="submit" class="btn-primary">Register</button>
        </form>

        <div class="auth-footer">
            <p>Already have an account? <a href="login.html">Login here</a></p>
        </div>
    </div>
    <div id="toast" class="toast hidden"></div>
    <script type="module" src="js/register.js"></script>
</body>
</html>

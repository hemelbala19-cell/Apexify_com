<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Activation - Apexify</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-body">
    <div class="auth-container">
        <div class="auth-header">
            <h2>Account Activation</h2>
            <p>Submit your TrxID to activate account.</p>
        </div>
        <form id="activationForm" class="auth-form">
            <div class="form-group">
                <label>Payment Method</label>
                <select id="paymentMethod" class="form-group input" style="width:100%; padding:10px; background:#1F2937; color:#fff; border:1px solid var(--border-color); border-radius:6px;">
                    <option value="bkash">bKash Merchant</option>
                    <option value="nagad">Nagad Merchant</option>
                </select>
            </div>
            <div class="form-group">
                <label>Transaction ID (TrxID)</label>
                <input type="text" id="trxId" required placeholder="Enter TrxID">
            </div>
            <button type="submit" class="btn-primary">Submit Activation</button>
        </form>
        <div class="auth-footer"><p><a href="dashboard.html">Back to Dashboard</a></p></div>
    </div>
    <script type="module" src="js/activation.js"></script>
</body>
</html>

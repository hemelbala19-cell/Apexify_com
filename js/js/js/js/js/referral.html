<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Referral - Apexify</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar">
            <div class="sidebar-brand"><h2>Apexify</h2></div>
            <ul class="sidebar-menu">
                <li><a href="dashboard.html">Home</a></li>
                <li><a href="wallet.html">Wallet</a></li>
                <li><a href="server.html">Server</a></li>
                <li><a href="referral.html" class="active">Referral</a></li>
                <li><a href="profile.html">Profile</a></li>
                <li><a href="support.html">Support</a></li>
            </ul>
        </aside>

        <main class="main-content">
            <header class="top-header"><div class="brand-title">Referral Network</div></header>
            <div class="dashboard-body" style="text-align: center;">
                <h2>Invite Friends & Earn</h2>
                <div style="margin: 20px 0;">
                    <p style="color: #9CA3AF;">Your Referral Code: <strong id="refCodeDisplay" style="color: var(--brand-blue);">---</strong></p>
                </div>
                <div class="form-group" style="max-width: 500px; margin: 0 auto;">
                    <label style="display:block; text-align:left; margin-bottom:5px;">Direct Referral Link</label>
                    <input type="text" id="refLinkInput" readonly style="text-align: center; width:100%; padding:10px; background:#1F2937; color:#fff; border:1px solid var(--border-color); border-radius:6px;">
                    <button id="copyRefBtn" class="btn-primary" style="margin-top: 10px;">Copy Referral Link</button>
                </div>
                <div style="margin-top: 30px;">
                    <p>Qualified Active Referrals (Real): <strong id="qualifiedCount" style="color: var(--profit-green);">0</strong></p>
                </div>
            </div>
        </main>
    </div>
    <script type="module" src="js/referral.js"></script>
</body>
</html>

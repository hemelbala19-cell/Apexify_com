<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Settings - Apexify</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar">
            <div class="sidebar-brand"><h2>Apexify Admin</h2></div>
            <ul class="sidebar-menu">
                <li><a href="admin.html">Overview</a></li>
                <li><a href="admin-settings.html" class="active">Limits & CS Agent</a></li>
                <li><a href="dashboard.html">Exit Admin</a></li>
            </ul>
        </aside>

        <main class="main-content">
            <header class="top-header"><div class="brand-title">System Settings & Limits</div></header>
            <div class="dashboard-body" style="max-width:600px;">
                <form id="settingsForm" class="auth-container" style="max-width:100%;">
                    <div class="form-group">
                        <label>Minimum Deposit Limit (BDT) [Min: 10৳]</label>
                        <input type="number" id="minDeposit" value="10" required class="form-group input" style="width:100%;">
                    </div>
                    <div class="form-group">
                        <label>Minimum Withdrawal Limit (BDT) [Min: 50৳]</label>
                        <input type="number" id="minWithdraw" value="50" required class="form-group input" style="width:100%;">
                    </div>
                    <div class="form-group">
                        <label>Customer Service Agent Link</label>
                        <input type="text" id="csAgentLink" placeholder="Telegram/WhatsApp link" class="form-group input" style="width:100%;">
                    </div>
                    <button type="submit" class="btn-primary" style="margin-top:15px;">Save Settings</button>
                </form>
            </div>
        </main>
    </div>
    <script type="module" src="js/admin-settings.js"></script>
</body>
</html>

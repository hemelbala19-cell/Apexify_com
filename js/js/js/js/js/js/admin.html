<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Control Panel - Apexify</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar">
            <div class="sidebar-brand"><h2>Apexify Admin</h2></div>
            <ul class="sidebar-menu">
                <li><a href="admin.html" class="active">Overview & Search</a></li>
                <li><a href="admin-settings.html">Limits & CS Agent</a></li>
                <li><a href="dashboard.html">Exit Admin</a></li>
            </ul>
        </aside>

        <main class="main-content">
            <header class="top-header"><div class="brand-title">Admin Dashboard</div></header>
            <div class="dashboard-body">
                <div class="plans-grid" style="margin-bottom: 30px;">
                    <div class="auth-container" style="max-width:100%;"><h3>Total Members</h3><h1 id="statTotalUsers">0</h1></div>
                    <div class="auth-container" style="max-width:100%;"><h3>Active Members</h3><h1 id="statActiveUsers" style="color:var(--profit-green);">0</h1></div>
                    <div class="auth-container" style="max-width:100%;"><h3>Total Deposit</h3><h1 id="statTotalDeposit">৳ 0</h1></div>
                    <div class="auth-container" style="max-width:100%;"><h3>Total Withdraw</h3><h1 id="statTotalWithdraw">৳ 0</h1></div>
                </div>

                <div class="auth-container" style="max-width:100%;">
                    <h3>Search User Profile (Phone / ID)</h3>
                    <div style="display:flex; gap:10px; margin-top:15px;">
                        <input type="text" id="searchUserInput" placeholder="Enter phone number" class="form-group input" style="flex:1; margin:0;">
                        <button id="searchUserBtn" class="btn-primary" style="width:150px; margin:0;">Search</button>
                    </div>
                    <div id="searchResultArea" style="margin-top:20px;"></div>
                </div>
            </div>
        </main>
    </div>
    <script type="module" src="js/admin-overview.js"></script>
</body>
  </html>

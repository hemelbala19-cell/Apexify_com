<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Apexify</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body style="font-family: Arial, sans-serif; background-color: #F3F4F6; margin: 0; padding: 20px;">
    <div style="max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
        <h2>User Dashboard</h2>
        <p>Welcome, <span id="userName">User</span>!</p>
        <hr style="margin: 20px 0; border: 0; border-top: 1px solid #E5E7EB;">
        <button id="logoutBtn" style="padding: 10px 20px; background-color: #EF4444; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">Logout</button>
    </div>
    <script type="module" src="js/dashboard.js"></script>
</body>
</html>

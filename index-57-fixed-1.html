async function submitTaskProof(taskId, btn){
  const proof = document.getElementById('task-proof').value.trim();
  const err = document.getElementById('task-submit-err');
  if(!currentTaskProofImage){ err.textContent='Upload a proof screenshot'; return; }
  err.textContent='';

  const t = state.tasks.find(x=>x.id===taskId);
  if(!t){ toast('Task not found'); return; }

  await withButtonLoading(btn, async ()=>{
    const ctx = await ensureReady();
    if(!ctx){ err.textContent='Check your internet connection and try again'; return; }
    const {fb, user} = ctx;

    try{
      const dupSnap = await fb.getDocs(fb.query(
        fb.collection(fb.db,'taskSubmissions'), fb.where('uid','==',user.uid), fb.where('taskId','==',taskId), fb.limit(1)
      ));
      if(!dupSnap.empty && dupSnap.docs[0].data().status!=='rejected'){
        err.textContent='This task has already been submitted'; return;
      }

      await fb.addDoc(fb.collection(fb.db,'taskSubmissions'),{
        uid:user.uid, taskId, taskTitle:t.title, reward:Number(t.reward||0),
        proof, proofImage:currentTaskProofImage, status:'pending', createdAt:fb.serverTimestamp()
      });
      currentTaskProofImage = null;
      toast('Task submitted, admin is reviewing');
      closeModal();
      await loadUserCollections();
      go('task');
    }catch(e){
      console.error(e);
      err.textContent = e?.code==='resource-exhausted' || /longer than/i.test(e?.message||'')
        ? 'Image is too large, try a smaller/lighter image'
        : "Couldn't submit, try again";
    }
  });
}

function copyDepositNumber(num){

let depSubmitting = false;
async function submitDeposit(btn){
  if(depSubmitting) return; // block double-submit
  const method = selectedDepositMethod;
  const amount = depositAmount;
  const txid = document.getElementById('deposit-txid')?.value.trim();

  if(!amount || amount < 1){ depError('Enter deposit amount'); return; }
  if(!txid){ depError('Enter Transaction ID'); return; }

  depError('');
  depSubmitting = true;
  await withButtonLoading(btn, async ()=>{
    const ctx = await ensureReady();
    if(!ctx){ depError('Check your internet connection and try again'); return; }
    const {fb, user} = ctx;
    try{
      const uid = user.uid;
      await fb.addDoc(fb.collection(fb.db,'depositRequests'),{
        uid,
        method,
        receiverNumber: getDepositNumber(method),
        amount,
        transactionId:txid,
        status:'pending',
        createdAt:fb.serverTimestamp()
      });
      depositAmount = 0;
      closeDeposit(); // exit immediately on successful submit
      toast('Deposit request submitted. Balance will be added after verification');
    }catch(e){
      console.error(e);
      depError("Couldn't submit request. Try again");
    }
  });
  depSubmitting = false;
}

  state.user.status = newStatus;
  await persistStatus();
}

/* Init: start on login (hidden behind the boot splash until we know the
   real auth state, so a returning logged-in user never sees a flash of
   the login form before the app shell appears). */
switchAuth('login');

function showBootSplash(){
  const el = document.getElementById('boot-splash');
  if(el) el.classList.remove('hidden');
}
function hideBootSplash(){
  const el = document.getElementById('boot-splash');
  if(el) el.classList.add('hidden');
}
// Safety net: never leave someone stuck behind the splash forever if
// Firebase fails to initialize (e.g. network totally blocked). Generous
// timeout — attemptSessionRestore's own 3 retries can legitimately take
// a while on a slow connection, and this must never interrupt them early.
setTimeout(()=>{
  const el = document.getElementById('boot-splash');
  if(el && !el.classList.contains('hidden')){
    hideBootSplash();
    switchAuth('login');
  }
}, 20000);

(async function initFirebaseSession(){
  if(!window.apexifyFirebase){
    await new Promise(resolve => window.addEventListener('apexify-fb-ready', resolve, {once:true}));
  }
  const fb=window.apexifyFirebase;
  if(!fb){ hideBootSplash(); return; }

  try{
    await loadFirebaseSettings();
    try{ await emvRestore(fb); }catch(e){ console.warn('Gmail verification restore failed', e); }

    fb.onAuthStateChanged(fb.auth, async user=>{
      if(!user){ hideBootSplash(); return; }

      // A signed-in account whose Auth email is still the real address
      // (a temporary verification-only account) means the person left
      // mid-registration before finishing on the registration form. Bring
      // them back to the registration screen with the email pre-filled and
      // status restored, instead of trying to load a full profile.
      if(!isPhoneLoginEmail(user.email)){
        // Leftover from the old verification flow: remove it from the main session.
        // (Gmail verification now runs in its own isolated session.)
        try{ await fb.signOut(fb.auth); }catch(e){}
        hideBootSplash();
        return;
      }

      attemptSessionRestore(false);
    });
  }catch(e){
    console.error('Firebase init failed',e);
    hideBootSplash();
  }

  const ref=getReferralFromUrl();
  const refInput=document.getElementById('reg-referral');
  if(ref && refInput) refInput.value=ref;
})();
</script>

  const $=s=>R.querySelector(s),wait=ms=>new Promise(r=>setTimeout(r,ms));
  const CONFIG={redirect:'',sound:true,haptics:true,name:''}; // name: override the name shown on the card
  const RM=matchMedia('(prefers-reduced-motion: reduce)').matches,T=RM?.45:1;
  const eio=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,smooth=t=>t*t*(3-2*t);
  const tw=(ms,fn,e=eio)=>new Promise(res=>{const t0=performance.now();(function f(n){const p=Math.min(1,(n-t0)/ms);fn(e(p),p);p<1?requestAnimationFrame(f):res()})(t0)});
  const rnd=(a,b)=>a+Math.random()*(b-a);

  /* ---------- grain texture ---------- */
  {const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d'),d=g.createImageData(128,128);
   for(let i=0;i<d.data.length;i+=4){const v=Math.random()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}
   g.putImageData(d,0,0);$('#gn').style.backgroundImage='url('+c.toDataURL()+')'}

  /* ---------- audio ---------- */
  const AC=window.AudioContext||window.webkitAudioContext;let au,out;
  function initAudio(){if(!CONFIG.sound||!AC)return;try{if(!au){au=new AC();out=au.createGain();out.gain.value=.8;const c=au.createDynamicsCompressor();out.connect(c);c.connect(au.destination)}if(au.state==='suspended')au.resume()}catch(e){au=null}}
  const tone=(f,d,v=.05,dl=0,ty='sine',f2)=>{if(!au)return;const t=au.currentTime+dl,o=au.createOscillator(),g=au.createGain();o.type=ty;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(out);o.start(t);o.stop(t+d+.05)};
  const tick=()=>tone(1480,.09,.02);

  const click=()=>{tone(210,.09,.09,0,'triangle');tone(2400,.03,.025)};

        st=$('#st'),pb=$('#pb'),under=$('#under'),gsh=$('#gsh'),dot=$('#dot'),rg1=$('#rg1'),rg2=$('#rg2'),bye=$('#bye'),byeh=$('#byeh'),
        faces=[...R.querySelectorAll('.face')];
  const getName=()=>{try{if(CONFIG.name)return CONFIG.name;if(typeof state!=='undefined'&&state&&state.user&&state.user.name&&state.user.name!=='User')return String(state.user.name).trim().slice(0,26)}catch(e){}return ''};
  const swap=(el,txt)=>{el.classList.add('sw');setTimeout(()=>{el.textContent=txt;el.classList.remove('sw')},230)};
  const setPb=p=>{pb.style.transform='scaleX('+p+')'};
  const GL='0123456789ABCDEF',hexs=()=>Array.from({length:4},()=>Array.from({length:4},()=>GL[Math.random()*16|0]).join('')).join(' ');

    r.addColorStop(0,'#ffffff');r.addColorStop(.22,c+'dd');r.addColorStop(.55,c+'33');r.addColorStop(1,c+'00');g.fillStyle=r;g.fillRect(0,0,48,48);return k};
  const SG=sprite('#00EFA3'),SB=sprite('#18C8FF');
  let S,Q=[],tar={x:0,y:0},cur={x:0,y:0},run=false,going=false,outDone=false;

  stage.addEventListener('pointermove',e=>{const w=innerWidth,h=innerHeight;tar.x=((e.clientX/w)-.5)*2;tar.y=((e.clientY/h)-.5)*2});
  stage.addEventListener('pointerleave',()=>{tar.x=tar.y=0});

  function frame(t){
    if(!run)return;
    try{
      cur.x+=(tar.x-cur.x)*.07;cur.y+=(tar.y-cur.y)*.07;
      const k=RM?0:1,ry=cur.x*11+k*Math.sin(t/1900)*3.4,rx=-cur.y*8+k*Math.sin(t/1400)*2.2;

      card.style.setProperty('--sx',(.5+ry/36+S.sx*1.2-.6).toFixed(3));

    byeh.innerHTML='<span class="ln">'+word('See')+' '+word('you')+' '+word('soon'+(n?',':''))+'</span>'+(n?'<span class="ln">'+n.split(/\s+/).map(x=>word(x,1)).join(' ')+'</span>':'');

  const doLogout=()=>{if(outDone)return Promise.resolve();outDone=true;try{return Promise.resolve(typeof window.logout==='function'?window.logout():0).catch(e=>console.warn(e))}catch(e){console.warn(e);return Promise.resolve()}};

<script>
(function(){

#pli-wrap{position:fixed;inset:0;z-index:20;background:#020817;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .45s,visibility .45s}
#pli-wrap.on{opacity:1;visibility:visible;pointer-events:auto}

      var x1=cx+p.x*k1+sw1,y1=cy+p.y*k1,x2=cx+p.x*k2+sw2,y2=cy+p.y*k2;
      if(x1<-80||x1>W+80||y1<-80||y1>H+80)continue;
      var near=Math.min(1,(1.6-p.z)*1.6);
      var al2=near*(.25+.75*spn)*live,lw=Math.min(3.6,p.w*(.5+.9/p.z*.35))*(W<700?.8:1);
      ctx.strokeStyle='rgba('+p.c+','+(al2*.18)+')';ctx.lineWidth=lw*5;
      ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x1,y1);ctx.stroke();
      ctx.strokeStyle='rgba('+(p.z<.35?'255,255,255':SOFT)+','+(al2*.95)+')';ctx.lineWidth=lw;
      ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x1,y1);ctx.stroke();
    }

    if(arrive>.01){
      var fg=ctx.createRadialGradient(cx,cy,0,cx,cy,Math.max(W,H)*.9);
      fg.addColorStop(0,'rgba(255,255,255,'+(.6*arrive)+')');
      fg.addColorStop(.25,'rgba('+SOFT+','+(.28*arrive)+')');
      fg.addColorStop(1,'rgba('+GREEN+','+(.06*arrive)+')');
      ctx.fillStyle=fg;ctx.fillRect(0,0,W,H);
    }
  }

  function sound(){
    try{
      var A=window.__primexAC||new (window.AudioContext||window.webkitAudioContext)();
      window.__primexAC=A; if(A.state==='suspended') A.resume();
      var T=A.currentTime+.05,N=120,D=6.0,i;
      var comp=A.createDynamicsCompressor();comp.connect(A.destination);
      var master=A.createGain();master.gain.setValueAtTime(.9,T);
      master.gain.setValueAtTime(.9,T+5.5);master.gain.exponentialRampToValueAtTime(.0001,T+6.4);
      master.connect(comp);
      function curve(fn){var a=new Float32Array(N);for(var k=0;k<N;k++){a[k]=fn(speed(k/(N-1)*D)/6.3,k/(N-1)*D);}return a;}

      var o1=A.createOscillator();o1.type='sawtooth';
      var o2=A.createOscillator();o2.type='sine';
      var lp=A.createBiquadFilter();lp.type='lowpass';lp.Q.value=2;
      var eg=A.createGain();
      o1.frequency.setValueCurveAtTime(curve(function(s){return 55+560*s;}),T,D);
      o2.frequency.setValueCurveAtTime(curve(function(s){return 28+130*s;}),T,D);
      lp.frequency.setValueCurveAtTime(curve(function(s){return 250+3200*s;}),T,D);
      eg.gain.setValueCurveAtTime(curve(function(s,t){return (.01+.11*s)*sm(0,.5,t);}),T,D);
      o1.connect(lp);o2.connect(lp);lp.connect(eg);eg.connect(master);
      o1.start(T);o2.start(T);o1.stop(T+6.5);o2.stop(T+6.5);

      var len=A.sampleRate*2,buf=A.createBuffer(1,len,A.sampleRate),d=buf.getChannelData(0);
      for(i=0;i<len;i++)d[i]=Math.random()*2-1;
      var ns=A.createBufferSource();ns.buffer=buf;ns.loop=true;
      var bp=A.createBiquadFilter();bp.type='bandpass';bp.Q.value=.9;
      var ng=A.createGain();
      bp.frequency.setValueCurveAtTime(curve(function(s){return 180+3800*s;}),T,D);
      ng.gain.setValueCurveAtTime(curve(function(s,t){return (.02+.3*s)*sm(0,.5,t);}),T,D);
      ns.connect(bp);bp.connect(ng);ng.connect(master);
      ns.start(T);ns.stop(T+6.5);

      var TA=T+ARRIVE;
      var b=A.createOscillator();b.type='sine';
      b.frequency.setValueAtTime(115,TA);b.frequency.exponentialRampToValueAtTime(32,TA+.9);
      var bg=A.createGain();bg.gain.setValueAtTime(.0001,TA-.02);bg.gain.exponentialRampToValueAtTime(.8,TA+.03);bg.gain.exponentialRampToValueAtTime(.0001,TA+1.5);
      b.connect(bg);bg.connect(master);b.start(TA-.02);b.stop(TA+1.6);

      var ns2=A.createBufferSource();ns2.buffer=buf;ns2.loop=true;
      var f2=A.createBiquadFilter();f2.type='bandpass';f2.Q.value=.7;
      f2.frequency.setValueAtTime(7000,TA);f2.frequency.exponentialRampToValueAtTime(350,TA+1.1);
      var g2=A.createGain();g2.gain.setValueAtTime(.0001,TA-.02);g2.gain.exponentialRampToValueAtTime(.4,TA+.03);g2.gain.exponentialRampToValueAtTime(.0001,TA+1.1);
      ns2.connect(f2);f2.connect(g2);g2.connect(master);ns2.start(TA-.02);ns2.stop(TA+1.2);

      [659.25,987.77,1318.51].forEach(function(fr,k){
        var c=A.createOscillator();c.type='sine';c.frequency.value=fr;
        var cg=A.createGain(),ts=TA+.05+k*.09;
        cg.gain.setValueAtTime(.0001,ts);cg.gain.exponentialRampToValueAtTime(.11,ts+.03);cg.gain.exponentialRampToValueAtTime(.0001,ts+1.7);
        c.connect(cg);cg.connect(master);c.start(ts);c.stop(ts+1.8);
      });
    }catch(e){ console.warn('[PrimeX] Login intro sound failed', e); }
  }

  function begin(){
    cycleStart=performance.now();last=0;
    seed();ctx.globalCompositeOperation='source-over';ctx.fillStyle='#020817';ctx.fillRect(0,0,W,H);
    sound();
  }
  function loop(now){
    if(!running) return;
    var t=(now-cycleStart)/1000;
    if(t>=CYCLE){begin();t=0;}
    var dt=Math.min(.05,Math.max(0,t-last));last=t;
    frame(t,dt);
    raf=requestAnimationFrame(loop);
  }

  window.addEventListener('resize', function(){ if(running){ size(); seed(); } });

  // Public API used by doLogin(): plays automatically (no "শুরু করো" button,
  // no click needed inside this component — starting it IS the click on
  // the Login button itself, which is what unlocks audio on mobile).
  window.playLoginIntro = function(){
    if(running) return;
    running = true;
    window.__pliStartedAt = performance.now();
    wrap.classList.add('on');
    try{
      var A=window.__primexAC||new (window.AudioContext||window.webkitAudioContext)();
      window.__primexAC=A; if(A.state==='suspended') A.resume();
    }catch(e){}
    size();
    begin();
    raf=requestAnimationFrame(loop);
  };
  window.stopLoginIntro = function(){
    if(!running) return;
    running = false;
    if(raf) cancelAnimationFrame(raf);
    wrap.classList.remove('on');
  };
  // Lets doLogin() wait for the full cinematic (~6.6s) before revealing the
  // dashboard when login itself finishes faster than that, so the animation
  // never gets cut short. If login takes longer, this resolves immediately.
  window.loginIntroMinWait = function(ms){
    ms = ms || 6600;
    var started = window.__pliStartedAt || performance.now();
    var remain = ms - (performance.now() - started);
    return remain > 0 ? new Promise(function(r){ setTimeout(r, remain); }) : Promise.resolve();
  };
})();
</script>

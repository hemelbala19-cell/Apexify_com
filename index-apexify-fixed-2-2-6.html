<style>
  :root{
    --bg:#F7F9FC;
    --card:#FFFFFF;
    --primary:#10B981;
    --primary-dark:#064E3B;
    --accent:#10B981;
    --accent-soft:#D1FAE5;
    --dark-card-1:#053B2C;
    --dark-card-2:#0B6B4F;
    --text:#0F172A;
    --text-mute:#64748B;
    --border:#E2E8F0;
    --danger:#EF4444;
    --danger-soft:#FEE2E2;
    --warning:#F59E0B;
    --warning-soft:#FEF3C7;
    --ok-soft:#D1FAE5;
    --radius-lg:16px;
    --radius-md:12px;
    --radius-btn:12px;
    --radius-pill:999px;
    --shadow:0 12px 28px rgba(15,23,42,0.07);
    --shadow-sm:0 4px 20px rgba(15,23,42,0.04);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; background:#EEF1F6; font-family:'Inter',sans-serif; color:var(--text);
    display:flex; justify-content:center;
  }
  h1,h2,h3,.display{font-family:'Plus Jakarta Sans',sans-serif;}
  #phone{
    width:100%; max-width:430px; min-height:100vh; background:var(--bg);
    position:relative; overflow-x:hidden; display:flex; flex-direction:column;
  }
  ::-webkit-scrollbar{display:none;}
  button{font-family:inherit; cursor:pointer;}
  input{font-family:inherit;}
  .hidden{display:none !important;}

  /* ---------- Buttons ---------- */
  .btn{
    border:none; border-radius:var(--radius-btn); padding:14px 20px; font-weight:600;
    font-size:15px; display:flex; align-items:center; justify-content:center; gap:8px;
    transition:transform .12s ease, opacity .15s ease, box-shadow .2s ease, filter .15s ease, background .15s ease;
    position:relative; min-height:44px;
  }
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:var(--primary); color:#fff; box-shadow:0 4px 12px rgba(16,185,129,.22);}
  .btn-primary:hover{background:#0DA271; box-shadow:0 6px 16px rgba(16,185,129,.28);}
  .btn-primary:active{background:#0A8A5F; box-shadow:0 2px 8px rgba(16,185,129,.3);}
  .btn-outline{background:#fff; color:var(--primary-dark); border:1.5px solid var(--border); transition:all .15s ease;}
  .btn-outline:hover{border-color:var(--primary); background:var(--accent-soft);}
  .btn-block{width:100%;}
  .btn-sm{padding:9px 16px; font-size:13px; min-height:38px;}
  .btn:disabled{opacity:.6; pointer-events:none;}
  .btn-spin{
    width:18px; height:18px; border-radius:50%;
    border:2.5px solid rgba(255,255,255,.4); border-top-color:#fff;
    animation:btnspin .7s linear infinite; flex-shrink:0;
  }
  .btn-outline .btn-spin, .btn-ghost .btn-spin{
    border:2.5px solid rgba(0,0,0,.15); border-top-color:var(--primary-dark);
  }
  @keyframes btnspin{to{transform:rotate(360deg);}}
  @keyframes spin{to{transform:rotate(360deg);}}
  .spinner{border:3px solid rgba(16,185,129,.15); border-top-color:var(--primary); border-radius:50%; animation:spin .7s linear infinite;}

  /* ---------- Auth ---------- */
  #auth-screen{flex:1; display:flex; flex-direction:column; padding:34px 24px 24px;}
  .auth-logo{display:flex; align-items:center; gap:10px; margin-bottom:36px;}
  .auth-logo .mark{width:42px; height:42px; border-radius:12px; overflow:hidden; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .auth-logo .mark img{width:100%; height:100%; object-fit:cover; display:block;}
  .auth-logo .name{font-weight:800; font-size:19px; letter-spacing:-.2px;}
  .auth-title{font-size:26px; font-weight:800; margin:0 0 6px; letter-spacing:-.3px;}
  .auth-sub{color:var(--text-mute); font-size:14.5px; margin:0 0 28px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12.5px; font-weight:600; color:var(--text-mute); margin-bottom:7px; letter-spacing:.2px;}
  .field-input{
    display:flex; align-items:center; gap:10px; background:#fff; border:1.5px solid var(--border);
    border-radius:var(--radius-btn); padding:13px 15px;
  }
  .field-input:focus-within{border-color:var(--primary); box-shadow:0 0 0 3px rgba(16,185,129,.12);}
  .field-input input{border:none; outline:none; flex:1; font-size:15px; background:transparent; color:var(--text);}
  .field-input svg{flex-shrink:0;}
  .dep-method-grid{display:flex; gap:10px; margin-bottom:16px;}
  .dep-method-item{flex:1; display:flex; flex-direction:column; align-items:center; gap:5px; padding:9px 6px; border:1.5px solid var(--border); border-radius:12px; cursor:pointer; transition:border-color .15s, background .15s;}
  .dep-method-item.active{border-color:var(--primary); background:rgba(16,185,129,.06);}
  .dep-method-logo{width:30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center; flex-shrink:0; overflow:hidden;}
  .dep-method-item span{font-size:11.5px; font-weight:700; color:var(--text);}
  .dep-number-box{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .dep-number-box b{font-size:16px; letter-spacing:.4px;}
  .eye-toggle{background:none; border:none; padding:2px; display:flex; color:var(--text-mute);}
  .row-between{display:flex; align-items:center; justify-content:space-between; margin:4px 0 22px;}
  .remember{display:flex; align-items:center; gap:8px; font-size:13.5px; color:var(--text-mute);}
  .link{color:var(--primary-dark); font-weight:700; font-size:13.5px; text-decoration:none;}
  .divider{display:flex; align-items:center; gap:10px; color:var(--text-mute); font-size:12.5px; margin:22px 0;}
  .divider::before,.divider::after{content:''; flex:1; height:1px; background:var(--border);}
  .social-row{display:flex; gap:10px;}
  .social-btn{flex:1; background:#fff; border:1.5px solid var(--border); border-radius:var(--radius-btn); padding:12px; display:flex; align-items:center; justify-content:center; gap:8px; font-weight:600; font-size:13.5px; transition:border-color .15s ease, background .15s ease;}
  .social-btn:active{transform:scale(0.97);}
  .social-btn:hover{border-color:var(--primary);}
  .auth-switch{text-align:center; margin-top:24px; font-size:14px; color:var(--text-mute);}
  .err-msg{color:var(--danger); font-size:12.5px; font-weight:600; margin-top:6px; min-height:16px;}

  /* ---------- App shell ---------- */
  #app-shell{flex:1; display:flex; flex-direction:column;}
  header.topbar{
    position:sticky; top:0; z-index:20; background:var(--bg); padding:16px 18px 10px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .brand{display:flex; align-items:center; gap:9px;}
  .brand .mark{width:34px; height:34px; border-radius:10px; overflow:hidden; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .brand .mark img{width:100%; height:100%; object-fit:cover; display:block;}
  .brand .name{font-weight:800; font-size:16px; letter-spacing:-.2px;}
  .top-actions{display:flex; align-items:center; gap:10px;}
  .icon-btn{
    width:40px; height:40px; border-radius:var(--radius-btn); background:#fff; border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center; position:relative; color:var(--text);
    transition:border-color .15s ease, background .15s ease;
  }
  .icon-btn:active{transform:scale(0.94);}
  .icon-btn:hover{border-color:var(--primary);}
  .badge-dot{position:absolute; top:6px; right:7px; width:8px; height:8px; border-radius:50%; background:var(--danger); border:2px solid var(--bg);}

  main{flex:1; padding:4px 18px 100px; overflow-y:auto;}
  .screen-title{font-size:20px; font-weight:800; margin:6px 0 16px; letter-spacing:-.3px;}
  .back-row{display:flex; align-items:center; gap:10px; margin:6px 0 16px;}
  .back-btn{width:36px; height:36px; border-radius:var(--radius-btn); background:#fff; border:1px solid var(--border); display:flex; align-items:center; justify-content:center;}

  /* ---------- Bottom nav ---------- */
  nav.bottomnav{
    position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:430px;
    background:#fff; border-top:1px solid var(--border); display:flex; align-items:center; justify-content:space-around;
    padding:10px 6px calc(10px + env(safe-area-inset-bottom)); z-index:30;
  }
  .nav-item{
    background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:4px;
    color:var(--text-mute); font-size:10.5px; font-weight:600; flex:1; padding:6px 0;
    transition:color .15s ease;
  }
  .nav-item:active{transform:scale(0.94);}
  .nav-item.active{color:var(--primary-dark);}
  .nav-fab{
    width:52px; height:52px; border-radius:50%; background:var(--primary);
    display:flex; align-items:center; justify-content:center; color:#fff; margin-top:-24px;
    transition:transform .15s ease, box-shadow .15s ease;
    box-shadow:0 8px 18px rgba(16,185,129,.32); border:4px solid var(--bg); flex-shrink:0;
  }
  .nav-fab:active{transform:scale(0.93);}

  /* ---------- Cards / dashboard ---------- */
  .banner{
    border-radius:var(--radius-lg); background:var(--primary-dark);
    color:#fff; padding:20px; margin-bottom:14px; position:relative; overflow:hidden;
  }
  .banner h3{margin:0 0 4px; font-size:16.5px; font-family:'Plus Jakarta Sans';}
  .banner p{margin:0; font-size:12.5px; opacity:.8; max-width:75%;}
  .banner .glow{position:absolute; right:-30px; top:-30px; width:120px; height:120px; border-radius:50%; background:rgba(255,255,255,.06);}

  .action-card{
    display:flex; align-items:center; gap:12px; background:var(--warning-soft); border:1px solid #FDE4A8;
    border-radius:var(--radius-md); padding:13px 14px; margin-bottom:14px;
  }
  .action-card .txt{flex:1;}
  .action-card .txt b{display:block; font-size:13.5px; margin-bottom:2px;}
  .action-card .txt span{font-size:12px; color:var(--text-mute);}

  .status-strip{display:flex; align-items:center; gap:8px; background:#fff; border:1px solid var(--border); border-radius:var(--radius-md); padding:11px 14px; margin-bottom:14px;}
  .status-dot{width:9px; height:9px; border-radius:50%; background:var(--primary);}
  .status-strip.inactive .status-dot{background:var(--danger);}
  .status-strip .stxt{flex:1; font-size:13.5px; font-weight:600;}
  .chip{font-size:11px; font-weight:700; padding:4px 10px; border-radius:var(--radius-pill);}
  .chip.ok{background:var(--ok-soft); color:var(--primary-dark);}
  .chip.warn{background:var(--warning-soft); color:var(--warning);}
  .chip.bad{background:var(--danger-soft); color:var(--danger);}

  .asset-card{
    border-radius:var(--radius-lg); background:linear-gradient(170deg,var(--dark-card-2),var(--dark-card-1));
    color:#fff; padding:22px 20px; margin-bottom:14px; position:relative; overflow:hidden;
  }
  .asset-card .lbl{font-size:12px; color:#A7D9C4; display:flex; align-items:center; justify-content:space-between;}
  .asset-card .val{font-size:30px; font-weight:800; font-family:'Plus Jakarta Sans'; margin:8px 0 16px; letter-spacing:-.4px;}
  .asset-card .sub-balances{display:flex; gap:10px;}
  .mini-bal{flex:1; background:rgba(255,255,255,.09); border-radius:var(--radius-md); padding:10px 12px;}
  .mini-bal span{display:block; font-size:10.5px; color:#A7D9C4; margin-bottom:4px;}
  .mini-bal b{font-size:14px; font-family:'Plus Jakarta Sans';}
  .currency-pill{background:rgba(255,255,255,.14); border:none; color:#fff; font-size:11px; font-weight:700; padding:4px 9px; border-radius:var(--radius-pill); display:flex; align-items:center; gap:4px;}

  .grid-2{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:14px;}
  .stat-card{background:#fff; border:1px solid var(--border); border-radius:var(--radius-md); padding:14px;}
  .stat-card span{font-size:11.5px; color:var(--text-mute); font-weight:600;}
  .stat-card b{display:block; font-size:18px; margin-top:4px; font-family:'Plus Jakarta Sans';}
  .stat-card b.up{color:var(--primary-dark);}

  .section-head{display:flex; align-items:center; justify-content:space-between; margin:18px 0 10px;}
  .section-head h3{font-size:15px; margin:0; font-family:'Plus Jakarta Sans'; font-weight:700;}
  .section-head .see-all{font-size:12.5px; font-weight:700; color:var(--primary-dark); background:none; border:none;}

  .services-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:6px;}
  .svc-item{display:flex; flex-direction:column; align-items:center; gap:7px; background:#fff; border:1px solid var(--border); border-radius:var(--radius-md); padding:12px 4px; text-align:center; transition:border-color .15s ease;}
  .svc-item:active{transform:scale(0.96);}
  .svc-item:hover{border-color:var(--primary);}
  .svc-item .ic{width:38px; height:38px; border-radius:10px; background:var(--accent-soft); color:var(--primary-dark); display:flex; align-items:center; justify-content:center;}
  .svc-item span{font-size:10.5px; font-weight:600; line-height:1.2;}

  .earn-item{display:flex; align-items:center; gap:12px; background:#fff; border:1px solid var(--border); border-radius:var(--radius-md); padding:12px 13px; margin-bottom:9px;}
  .earn-item .ic{width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .earn-item .ic.plus{background:var(--ok-soft); color:var(--primary-dark);}
  .earn-item .ic.minus{background:var(--danger-soft); color:var(--danger);}
  .earn-item .body{flex:1; min-width:0;}
  .earn-item .body b{display:block; font-size:13.5px;}
  .earn-item .body span{font-size:11.5px; color:var(--text-mute);}
  .earn-item .amt{font-size:14px; font-weight:800; font-family:'Plus Jakarta Sans';}
  .amt.plus{color:var(--primary-dark);} .amt.minus{color:var(--danger);}

  .ranker-row{display:flex; align-items:center; gap:11px; background:#fff; border:1px solid var(--border); border-radius:var(--radius-md); padding:11px 13px; margin-bottom:9px;}
  .rank-no{width:26px; height:26px; border-radius:50%; background:var(--ok-soft); color:var(--primary-dark); font-weight:800; font-size:12px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .rank-no.gold{background:var(--warning-soft); color:var(--warning);}
  .avatar{width:34px; height:34px; border-radius:50%; background:var(--primary-dark); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; flex-shrink:0;}
  .ranker-row .body{flex:1;}
  .ranker-row .body b{display:block; font-size:13.5px;}
  .ranker-row .body span{font-size:11.5px; color:var(--text-mute);}

  .partners-row{display:flex; gap:10px; overflow-x:auto; padding-bottom:4px;}
  .partner-chip{flex-shrink:0; background:#fff; border:1px solid var(--border); border-radius:var(--radius-md); padding:10px 16px; font-weight:700; font-size:13px; color:var(--text);}

  /* ---------- Generic list / detail card ---------- */
  .card{background:#fff; border:1px solid var(--border); border-radius:var(--radius-md); padding:16px; margin-bottom:14px;}
  .kv-row{display:flex; align-items:center; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--border); font-size:13.5px;}
  .kv-row:last-child{border-bottom:none;}
  .kv-row span{color:var(--text-mute);}
  .kv-row b{font-weight:700;}

  .tabbar{display:flex; background:#fff; border:1px solid var(--border); border-radius:var(--radius-pill); padding:4px; margin-bottom:16px;}
  .tabbar button{flex:1; border:none; background:none; padding:9px 6px; border-radius:var(--radius-pill); font-weight:700; font-size:12.5px; color:var(--text-mute); transition:background .15s ease, color .15s ease;}
  .tabbar button:active{transform:scale(0.96);}
  .tabbar button.active{background:var(--primary); color:#fff;}

  .empty-state{display:flex; flex-direction:column; align-items:center; text-align:center; padding:50px 20px; color:var(--text-mute);}

  /* ---- boot splash ---- */
  #boot-splash{
    position:fixed; inset:0; z-index:9999; background:var(--primary-dark);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    transition:opacity .3s ease, visibility .3s ease;
  }
  #boot-splash.hidden{opacity:0; visibility:hidden; pointer-events:none;}
  #boot-splash .splash-mark{
    width:84px; height:84px; border-radius:20px;
    overflow:hidden;
    display:flex; align-items:center; justify-content:center;
  }
  #boot-splash .splash-mark img{width:100%; height:100%; object-fit:cover; display:block;}
  #boot-splash .splash-name{
    margin-top:20px; font-weight:700; font-size:19px; letter-spacing:1px;
    color:#fff;
  }
  #boot-splash .splash-spin{
    margin-top:24px; width:24px; height:24px; border-radius:50%;
    border:3px solid rgba(255,255,255,.25); border-top-color:#fff;
    animation:spin .8s linear infinite;
  }

  /* ---- task cards ---- */
  .task-card{
    position:relative; background:#fff; border:1px solid var(--border); border-radius:var(--radius-md);
    padding:16px; margin-bottom:12px; overflow:hidden;
    box-shadow:var(--shadow-sm);
    transition:border-color .15s ease;
  }
  .task-card:active{transform:scale(0.99);}
  .task-icon{
    width:42px; height:42px; border-radius:11px; flex-shrink:0; overflow:hidden;
    background:var(--accent-soft); display:flex; align-items:center; justify-content:center;
    color:var(--primary-dark); border:1px solid var(--border);
  }
  .task-icon img{width:100%; height:100%; object-fit:cover; display:block;}
  .task-reward-pill{
    background:var(--accent-soft); color:var(--primary-dark);
    font-weight:800; font-size:14px; padding:7px 14px; border-radius:var(--radius-pill); flex-shrink:0;
  }
  .task-btn-outline{
    flex:1; text-decoration:none; text-align:center; padding:12px 16px; border-radius:var(--radius-btn);
    font-weight:600; font-size:13.5px; color:var(--primary-dark); background:#fff;
    border:1.5px solid var(--border); display:flex; align-items:center; justify-content:center; gap:6px;
    transition:border-color .15s ease, background .15s ease; min-height:44px;
  }
  .task-btn-outline:active{transform:scale(0.97); border-color:var(--primary); background:var(--accent-soft);}
  .empty-state .ic{width:52px; height:52px; border-radius:50%; background:var(--accent-soft); color:var(--primary-dark); display:flex; align-items:center; justify-content:center; margin-bottom:14px;}
  .empty-state b{color:var(--text); font-size:14.5px; display:block; margin-bottom:4px;}
  .empty-state span{font-size:12.5px;}

  .wallet-item{display:flex; align-items:center; gap:12px; background:#fff; border:1px solid var(--border); border-radius:var(--radius-md); padding:13px; margin-bottom:10px;}
  .wallet-item .ic{width:42px; height:42px; border-radius:11px; display:flex; align-items:center; justify-content:center; font-weight:800; color:#fff; font-size:12px; flex-shrink:0;}
  .wallet-item .body{flex:1;}
  .wallet-item .body b{display:block; font-size:14px;}
  .wallet-item .body span{font-size:11.5px; color:var(--text-mute);}
  .wallet-item .del{background:none; border:none; color:var(--danger); padding:6px;}

  .progress-wrap{background:#E8EDF3; border-radius:var(--radius-pill); height:8px; overflow:hidden; margin:10px 0;}
  .progress-bar{height:100%; border-radius:var(--radius-pill); background:var(--primary);}

  .modal-overlay{position:fixed; inset:0; background:rgba(15,23,42,.45); z-index:50; display:flex; align-items:flex-end; justify-content:center;}
  .modal-overlay.center{align-items:center; padding:20px;}
  .sheet{
    width:100%; max-width:430px; background:var(--bg); border-radius:20px 20px 0 0; padding:20px 20px calc(20px + env(safe-area-inset-bottom));
    max-height:82vh; overflow-y:auto;
  }
  .sheet.card-modal{border-radius:16px; max-width:360px; padding:22px;}
  .sheet-handle{width:38px; height:4px; background:var(--border); border-radius:99px; margin:0 auto 16px;}
  .sheet h3{margin:0 0 4px; font-size:17px; font-family:'Plus Jakarta Sans';}
  .sheet p.desc{color:var(--text-mute); font-size:13px; margin:0 0 18px;}

  .toast{
    position:fixed; bottom:96px; left:50%; transform:translateX(-50%); background:var(--text); color:#fff;
    padding:12px 18px; border-radius:var(--radius-btn); font-size:13px; font-weight:600; z-index:60;
    display:flex; align-items:center; gap:8px; box-shadow:var(--shadow); max-width:88%;
  }

  .code-input{
    width:100%; text-align:center; letter-spacing:4px; font-weight:800; font-size:18px; padding:16px; border-radius:var(--radius-btn);
    border:1.5px dashed var(--primary); background:var(--accent-soft); color:var(--primary-dark); outline:none;
  }

  .profile-head{display:flex; flex-direction:column; align-items:center; padding:14px 0 20px;}
  .profile-avatar{width:76px; height:76px; border-radius:50%; background:var(--primary-dark); color:#fff; font-size:26px; font-weight:800; display:flex; align-items:center; justify-content:center; margin-bottom:10px; font-family:'Plus Jakarta Sans'; background-size:cover; background-position:center; overflow:hidden;}
  .avatar-wrap{position:relative; display:inline-block;}
  .avatar-edit-badge{position:absolute; right:2px; bottom:12px; width:26px; height:26px; border-radius:50%; background:var(--primary); color:#fff; display:flex; align-items:center; justify-content:center; border:2px solid #fff; cursor:pointer;}
  .userid-row{display:flex; align-items:center; gap:5px;}
  .userid-copy-btn{display:flex; align-items:center; justify-content:center; width:20px; height:20px; padding:0; border:none; background:none; color:var(--text-mute); cursor:pointer;}
  .userid-copy-btn:active{color:var(--primary);}
  .profile-head b{font-size:17px;}
  .profile-head span{font-size:12.5px; color:var(--text-mute);}
  .menu-row{display:flex; align-items:center; gap:12px; background:#fff; border:1px solid var(--border); border-radius:var(--radius-md); padding:13px; margin-bottom:10px; transition:border-color .15s ease; cursor:pointer;}
  .menu-row:active{transform:scale(0.99);}
  .menu-row:hover{border-color:var(--primary);}
  .menu-row .ic{width:36px; height:36px; border-radius:10px; background:var(--accent-soft); color:var(--primary-dark); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .menu-row span{flex:1; font-weight:600; font-size:13.5px;}
  .menu-row.danger .ic{background:var(--danger-soft); color:var(--danger);}
  .menu-row.danger span{color:var(--danger);}

  .skeleton{background:linear-gradient(90deg,#EDF1F6 25%,#F7F9FC 37%,#EDF1F6 63%); background-size:400% 100%; animation:sk 1.4s ease infinite; border-radius:var(--radius-md);}
  @keyframes sk{0%{background-position:100% 50%} 100%{background-position:0 50%}}

  /* ---------- Account activation ---------- */
  .activation-card{
    border-radius:var(--radius-lg); background:var(--warning-soft); border:1px solid #FDE4A8;
    padding:18px; margin-bottom:14px;
  }
  .activation-card-top{display:flex; align-items:center; gap:12px; margin-bottom:14px;}
  .activation-ic{width:44px; height:44px; border-radius:11px; background:#fff; color:var(--warning); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .activation-card-top b{display:block; font-size:14.5px; margin-bottom:2px;}
  .activation-card-top span{font-size:12px; color:var(--text-mute);}

  .svc-item{position:relative;}
  .lock-badge{position:absolute; top:6px; right:6px; width:18px; height:18px; border-radius:50%; background:#fff; border:1px solid var(--border); display:flex; align-items:center; justify-content:center; color:var(--text-mute); box-shadow:var(--shadow-sm);}

  .plan-list{display:flex; flex-direction:column; gap:10px;}
  .plan-item{display:flex; align-items:center; gap:12px; border:1.5px solid var(--border); border-radius:var(--radius-md); padding:13px 14px; cursor:pointer; background:#fff;}
  .plan-item input{accent-color:#10B981; width:18px; height:18px; flex-shrink:0;}
  .plan-item:has(input:checked){border-color:var(--primary); background:var(--accent-soft);}
  .plan-body b{display:block; font-size:13.5px;}
  .plan-body span{font-size:11.5px; color:var(--text-mute);}
  .plan-note{font-size:11px; color:var(--text-mute); text-align:center; margin-top:10px; line-height:1.5;}

  .activation-box{
    background:#fff; border-radius:var(--radius-lg); padding:36px 26px; display:flex; flex-direction:column; align-items:center;
    text-align:center; width:100%; max-width:320px; box-shadow:var(--shadow);
  }
  .spinner-ring{
    width:56px; height:56px; border-radius:50%; border:5px solid var(--accent-soft);
    border-top-color:var(--primary); animation:actSpin .9s linear infinite; margin-bottom:20px;
  }
  @keyframes actSpin{to{transform:rotate(360deg)}}
  .check-mark{width:56px; height:56px; margin-bottom:20px;}
  .check-circle{stroke:var(--primary); stroke-width:2; fill:none; stroke-dasharray:166; stroke-dashoffset:166;}
  .check-path{stroke:var(--primary); stroke-width:3; fill:none; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:48; stroke-dashoffset:48;}
  .check-mark.draw .check-circle{animation:actCircle .4s ease forwards;}
  .check-mark.draw .check-path{animation:actTick .3s .35s ease forwards;}
  @keyframes actCircle{to{stroke-dashoffset:0}}
  @keyframes actTick{to{stroke-dashoffset:0}}

  (async function initAuthPersistence(){
    // Explicitly force local (IndexedDB) persistence so the login session
    // survives a full page refresh. Without this, some browsers/in-app
    // webviews (Chrome custom tabs opened from Google, Facebook/Messenger
    // in-app browser, private/incognito windows, or Safari with strict
    // tracking prevention) fall back to session-only or no persistence at

    // so no sign-in call anywhere in the app can race ahead of the
    // persistence mode being set — a race here was letting a refresh
    // sometimes drop the session and bounce to the registration screen.
    try{
      await setPersistence(firebaseAuth, browserLocalPersistence);
    }catch(e){
      console.warn('[Apexify] Could not set auth persistence — this browser may block IndexedDB/local storage, so login will not survive a refresh.', e);

    };

const state = {

    name:'Rafiul Islam', phone:'01712-345678', userId:'PB-204981', referralId:'PB-204981',
    level:'Silver', designation:'Member', status:'inactive', // active | inactive | pending

};

// Subscription plans that unlock the account (Task / Refer / Wallet / Withdraw / Salary).
// NOTE: this is a UI-only demo flow. Wire the real charge to a licensed gateway
// (bKash/Nagad Merchant API, SSLCommerz, etc.) on the backend before going live —
// never collect payment confirmation client-side only.
const PLANS = [
  {id:'monthly', name:'Monthly Plan', price:299, period:'month'},
  {id:'yearly', name:'Yearly Plan', price:2499, period:'year', note:'Best value'},
];

// Features that require an active subscription to use.
const LOCKED_VIEWS = ['wallet','salary','network','redeem','withdraw','task','packages'];

let currentView = 'home';
let selectedPlan = 'monthly';
let selectedDepositMethod = 'bKash';

/* ============================================================
   FIREBASE DATA LAYER
   - Firebase Auth stores the password securely.
   - Firestore stores the user's profile, balances, referral data,
     activation status and transaction history.
   - New accounts start with every balance at 0.
   ============================================================ */

const DEFAULT_SETTINGS = {
  activationFee: 10,
  referralCommission: 15,
  referralOverridePercent: 5,
  dailyFreeIncome: 30,
  minDeposit: 50,
  maxDeposit: 50000,
  minWithdraw: 100,
  maxWithdraw: 20000,
  withdrawFeePercent: 2,
  salaryTarget: 50,
  salaryMonthly: 3000,
  supportLink: '',
  withdrawPolicy: 'all'
};

let firebaseSettings = {...DEFAULT_SETTINGS};
let firebaseUnsubUser = null;

// Holds the details of an email that has (or is being) verified before
// registration completes. { uid, email }
let pendingVerification = null;
let resendCooldownUntil = 0;

function isPhoneLoginEmail(email){
  return !!email && email.endsWith('@login.apexify.local');
}

function normalizePhone(phone){
  return phone.replace(/\s|-/g,'');
}

function phoneAuthEmail(phone){
  // The phone number is used only as the user's login identifier.
  // The actual password is handled by Firebase Authentication.
  return `${normalizePhone(phone)}@login.apexify.local`;
}

function makeReferralCode(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let code = 'PB-';
  for(let i=0;i<6;i++) code += chars[Math.floor(Math.random()*chars.length)];
  return code;
}

function getReferralFromUrl(){
  try{
    const p = new URLSearchParams(location.search);
    return (p.get('ref') || '').trim().toUpperCase();
  }catch(e){ return ''; }
}

async function loadFirebaseSettings(){
  const fb = window.apexifyFirebase;
  if(!fb) return;
  try{
    const snap = await fb.getDoc(fb.doc(fb.db,'settings','config'));
    if(snap.exists()){
      firebaseSettings = {...DEFAULT_SETTINGS, ...(snap.data() || {})};
    }
  }catch(e){
    console.warn('Settings read failed; using defaults.', e);
    firebaseSettings = {...DEFAULT_SETTINGS};
  }
}

function applyFirebaseUserData(data){
  const d = data || {};
  state.user = {
    ...state.user,
    ...d,
    name: d.name || state.user.name || 'User',
    phone: d.phone || state.user.phone || '',
    userId: d.userId || state.user.userId || d.uid || '',
    referralId: d.referralId || state.user.referralId || '',
    status: d.status || 'inactive',
    avatarInitial: (d.name || state.user.name || 'U')[0],
    totalRevenue: Number(d.totalRevenue || 0),
    mainBalance: Number(d.mainBalance || 0),
    salaryBalance: Number(d.salaryBalance || 0),
    referralBalance: Number(d.referralBalance || 0),
    depositBalance: Number(d.depositBalance || 0),
    referralCount: Number(d.referralCount || 0),
    completedTaskIds: Array.isArray(d.completedTaskIds) ? d.completedTaskIds : [],
    bkashNumber: d.bkashNumber || null,
    bkashVerified: !!d.bkashVerified,
    nagadNumber: d.nagadNumber || null,
    nagadVerified: !!d.nagadVerified,
    hasPurchasedPackage: !!d.hasPurchasedPackage,
    currency: 'BDT'
  };
}

function timeAgo(date){
  const s = Math.floor((Date.now() - date.getTime())/1000);
  if(s < 60) return 'Just now';
  const m = Math.floor(s/60);
  if(m < 60) return `${m} min ago`;
  const h = Math.floor(m/60);
  if(h < 24) return `${h}h ago`;
  const dday = Math.floor(h/24);
  if(dday === 1) return 'Yesterday';
  if(dday < 7) return `${dday}d ago`;
  return date.toLocaleDateString('en-US');
}

function updateNotifBadge(){
  const badge = document.getElementById('notif-badge');
  if(!badge) return;
  const unread = (state.notifications||[]).some(n=>!n.read);
  badge.classList.toggle('hidden', !unread);
}

async function loadCurrentUser(){
  const fb = window.apexifyFirebase;
  if(!fb || !fb.auth.currentUser) return false;

  await loadFirebaseSettings();
  const uid = fb.auth.currentUser.uid;
  const snap = await fb.getDoc(fb.doc(fb.db,'users',uid));
  if(!snap.exists()){
    toast('Account data not found');
    return false;
  }
  const userData = snap.data();
  if(userData.banned){
    try{ await fb.signOut(fb.auth); }catch(e){}
    toast('Your account has been banned. Contact support for details.');
    return false;
  }

  applyFirebaseUserData(userData);
  await grantDailyFreeIncome();
  await grantInvestmentIncome();
  await processActivationReferralCommission();
  await loadUserCollections();
  return true;
}

// Re-fetches everything (settings, balances, history) and re-renders the
// current screen WITHOUT reloading the browser page — so the session and
// scroll position are never disturbed and there's no risk of a logout.
async function softRefresh(btn){
  const spin = btn?.querySelector('svg');
  if(spin) spin.style.animation = 'spin .6s linear infinite';
  try{
    const ctx = await ensureReady();
    if(!ctx){ toast('Check your internet connection and try again'); return; }
    const ok = await loadCurrentUser();
    if(ok){
      go(currentView || 'home');
      toast('Refreshed');
    }
  }catch(e){
    console.error(e);
    toast("Couldn't refresh");
  } finally {
    if(spin) spin.style.animation = '';
  }
}

function openSupport(){
  const link = (firebaseSettings.supportLink || '').trim();
  if(!link){ toast("Support link hasn't been set yet"); return; }
  window.open(link, '_blank');
}

async function loadUserCollections(){
  const fb = window.apexifyFirebase;
  if(!fb || !fb.auth.currentUser) return;
  const uid = fb.auth.currentUser.uid;

  try{
    const rq = await fb.getDocs(
      fb.query(fb.collection(fb.db,'publicProfiles'), fb.where('referrerUid','==',uid))
    );
    state.referrals = rq.docs.map(s => {
      const d=s.data();
      return {
        name:d.name || 'User',
        id:d.userId || s.id,
        date:d.createdAt?.toDate ? d.createdAt.toDate().toLocaleDateString('en-US') : '',
        status:d.status || 'inactive'
      };
    });
  }catch(e){ console.warn('Referral list read failed',e); }

  try{
    const tq = await fb.getDocs(
      fb.query(
        fb.collection(fb.db,'transactions'),
        fb.where('uid','==',uid)
      )
    );
    state.earningsHistory = tq.docs.map(s=>{
      const d=s.data();
      const raw = Number(d.amount||0);
      return {
        t:d.title || 'Income',
        d:d.createdAt?.toDate ? d.createdAt.toLocaleString('en-US') : 'Now',
        amt:Math.abs(raw),
        sign: raw < 0 ? -1 : 1
      };
    }).sort((a,b)=>String(b.d).localeCompare(String(a.d))).slice(0,100);
  }catch(e){ console.warn('Transaction read failed',e); }

  // One-time migration: users who added wallets under the old (editable,
  // multi-slot) system get those numbers copied into the new permanent
  // bkash/nagad fields, if those fields are still empty.
  try{
    if(!state.user.bkashNumber || !state.user.nagadNumber){
      const wq = await fb.getDocs(fb.collection(fb.db,'users',uid,'wallets'));
      const oldWallets = wq.docs.map(s=>s.data());
      const patch = {};
      if(!state.user.bkashNumber){
        const old = oldWallets.find(w=>w.type==='bKash');
        if(old){ patch.bkashNumber = old.number; patch.bkashVerified = !!old.verified; }
      }
      if(!state.user.nagadNumber){
        const old = oldWallets.find(w=>w.type==='Nagad');
        if(old){ patch.nagadNumber = old.number; patch.nagadVerified = !!old.verified; }
      }
      if(Object.keys(patch).length){
        await fb.updateDoc(fb.doc(fb.db,'users',uid), patch);
        Object.assign(state.user, patch);
      }
    }
  }catch(e){ console.warn('Wallet migration failed',e); }

  try{
    const nq = await fb.getDocs(
      fb.query(fb.collection(fb.db,'users',uid,'notifications'), fb.orderBy('createdAt','desc'), fb.limit(50))
    );
    state.notifications = nq.docs.map(s=>{
      const d=s.data();
      return {
        id:s.id, title:d.title||'', body:d.body||'', type:d.type||'general',
        read:!!d.read, time: d.createdAt?.toDate ? timeAgo(d.createdAt.toDate()) : 'Now'
      };
    });
    updateNotifBadge();
  }catch(e){ console.warn('Notifications read failed',e); }

  try{
    const wdq = await fb.getDocs(fb.query(fb.collection(fb.db,'withdrawalRequests'), fb.where('uid','==',uid)));
    state.withdrawHistory = wdq.docs.map(s=>{
      const d=s.data();
      return {
        amt:Number(d.amount||0),
        wallet:`${d.walletType||''} •• ${(d.walletNumber||'').slice(-4)}`,
        date:d.createdAt?.toDate ? d.createdAt.toDate().toLocaleDateString('en-US') : '',
        status:d.status||'pending'
      };
    }).sort((a,b)=>String(b.date).localeCompare(String(a.date)));

/* ============================================================
   REFERRAL INCOME OVERRIDE — every time a member earns any income
   (daily free income, investment payouts, task/sell/salary income
   credited by admin), their direct referrer automatically gets a
   percentage of it, forever. The percentage is admin-configurable
   via settings/config -> referralOverridePercent (default 5%).

   IMPORTANT: this does NOT read the referrer's document — only
   the earner's own referrerUid (which the earner can already
   read on their own doc) is needed. The referrer's balance is
   updated with an atomic increment(), never a read-then-add. This
   matters because most rule sets only grant a normal member
   permission to WRITE specific balance fields on another user's
   doc (not to READ that whole doc) — reading it here would throw
   permission-denied and roll back the entire transaction,
   including the earner's own legitimate balance update.
   ============================================================ */
function writeReferralOverride(fb, tx, referrerUid, incomeAmount){
  if(!referrerUid || !incomeAmount) return 0;
  const percent = Number(firebaseSettings.referralOverridePercent ?? 5);
  if(percent<=0) return 0;
  const overrideAmt = Math.round(incomeAmount*percent)/100;
  if(overrideAmt<=0) return 0;
  const refRef = fb.doc(fb.db,'users',referrerUid);
  tx.update(refRef, {
    mainBalance: fb.increment(overrideAmt),
    referralBalance: fb.increment(overrideAmt),
    totalRevenue: fb.increment(overrideAmt),
    updatedAt: fb.serverTimestamp()
  });
  return overrideAmt;
}
// Call AFTER the transaction commits successfully, to log + notify the referrer.
async function logReferralOverride(fb, referrerUid, overrideAmt, sourceUid, sourceLabel){
  if(!referrerUid || !overrideAmt) return;
  try{
    await fb.addDoc(fb.collection(fb.db,'transactions'),{
      uid:referrerUid, type:'referral_override',
      title:`Referral income bonus — ${sourceLabel}`,
      amount:overrideAmt, sourceUid, createdAt:fb.serverTimestamp()
    });
    const notifRef = fb.doc(fb.collection(fb.db,'users',referrerUid,'notifications'));
    await fb.setDoc(notifRef,{
      title:'Referral income bonus',
      body:`You received ৳${overrideAmt} referral income bonus`,
      type:'referral', read:false, createdAt:fb.serverTimestamp()
    });
  }catch(e){ console.warn('Referral override log failed',e); }
}

async function grantDailyFreeIncome(){
  const fb = window.apexifyFirebase;
  if(!fb || !fb.auth.currentUser) return;

  const uid = fb.auth.currentUser.uid;
  const userRef = fb.doc(fb.db,'users',uid);
  const today = new Date().toISOString().slice(0,10);
  const amount = Number(firebaseSettings.dailyFreeIncome || 30);

  try{
    let added = false;
    let overrideReferrerUid = null, overrideAmt = 0;
    await fb.runTransaction(fb.db, async tx=>{
      const snap = await tx.get(userRef);
      if(!snap.exists()) return;
      const d=snap.data();
      if(d.status !== 'active') return;
      if(d.lastDailyCredit === today) return;

      tx.update(userRef,{
        mainBalance: Number(d.mainBalance||0) + amount,
        totalRevenue: Number(d.totalRevenue||0) + amount,
        lastDailyCredit: today,
        updatedAt: fb.serverTimestamp()
      });
      if(d.referrerUid){
        overrideAmt = writeReferralOverride(fb, tx, d.referrerUid, amount);
        if(overrideAmt>0) overrideReferrerUid = d.referrerUid;
      }
      added = true;
    });

    if(added){
      await fb.addDoc(fb.collection(fb.db,'transactions'),{
        uid, type:'daily', title:'Daily free income',
        amount, createdAt:fb.serverTimestamp()
      });
      if(overrideReferrerUid && overrideAmt>0){
        await logReferralOverride(fb, overrideReferrerUid, overrideAmt, uid, 'Daily free income');
      }
      const snap=await fb.getDoc(userRef);
      if(snap.exists()) applyFirebaseUserData(snap.data());
      state.earningsToday = amount;
    }
  }catch(e){
    console.warn('Daily income failed',e);
  }
}

async function processActivationReferralCommission(){
  const fb = window.apexifyFirebase;
  if(!fb || !fb.auth.currentUser) return;

  const uid = fb.auth.currentUser.uid;
  const userRef = fb.doc(fb.db,'users',uid);

  try{
    let rewarded = false;
    let referrerUid = null;
    const commission = Number(firebaseSettings.referralCommission || 15);

    await fb.runTransaction(fb.db, async tx=>{
      const userSnap = await tx.get(userRef);
      if(!userSnap.exists()) return;

      const u=userSnap.data();
      if(u.status !== 'active' || !u.referrerUid || u.referralRewarded === true) return;

      const refRef = fb.doc(fb.db,'users',u.referrerUid);
      const refSnap = await tx.get(refRef);
      if(!refSnap.exists()) return;

      const r=refSnap.data();
      const pubRef = fb.doc(fb.db,'publicProfiles',u.referrerUid);
      const pubSnap = await tx.get(pubRef);

      tx.update(refRef,{
        referralBalance:Number(r.referralBalance||0)+commission,
        mainBalance:Number(r.mainBalance||0)+commission,
        totalRevenue:Number(r.totalRevenue||0)+commission,
        referralCount:Number(r.referralCount||0)+1,
        updatedAt:fb.serverTimestamp()
      });
      tx.update(userRef,{referralRewarded:true, updatedAt:fb.serverTimestamp()});
      if(pubSnap.exists()){
        tx.update(pubRef,{referralCount:Number(pubSnap.data().referralCount||0)+1});
      }
      const notifRef = fb.doc(fb.collection(fb.db,'users',u.referrerUid,'notifications'));
      tx.set(notifRef,{
        title:'New referral commission',
        body:`You received ৳${commission} referral commission`,
        type:'referral', read:false, createdAt:fb.serverTimestamp()
      });
      rewarded=true;
      referrerUid=u.referrerUid;
    });

    if(rewarded){
      await fb.addDoc(fb.collection(fb.db,'transactions'),{
        uid:referrerUid,
        type:'referral',
        title:'Referral commission',
        amount:commission,
        sourceUid:uid,
        createdAt:fb.serverTimestamp()
      });
    }
  }catch(e){
    console.warn('Referral commission failed',e);
  }
}

async function grantInvestmentIncome(){
  const fb = window.apexifyFirebase;
  if(!fb || !fb.auth.currentUser) return;
  const uid = fb.auth.currentUser.uid;
  const now = Date.now();
  const DAY_MS = 24*60*60*1000;

  try{
    const snap = await fb.getDocs(fb.query(fb.collection(fb.db,'investmentSubscriptions'), fb.where('uid','==',uid), fb.where('status','==','active')));
    for(const s of snap.docs){
      const sub = s.data();
      const duration = Number(sub.durationDays||0);
      const daysCredited = Number(sub.daysCredited||0);
      if(daysCredited >= duration) continue;
      const purchaseTime = sub.createdAt?.toDate ? sub.createdAt.toDate().getTime() : null;
      if(!purchaseTime) continue;

      // Day 1's payout unlocks exactly 24h after purchase, day 2's at 48h, etc.
      // Same clock time every day — the purchase day itself earns nothing.
      const elapsedDays = Math.floor((now - purchaseTime) / DAY_MS);
      const eligibleDays = Math.min(elapsedDays, duration);
      if(eligibleDays <= daysCredited) continue;

      const daysToCredit = eligibleDays - daysCredited;
      const income = Number(sub.dailyIncome||0);
      const totalToCredit = income * daysToCredit;
      const newDaysCredited = daysCredited + daysToCredit;

      const subRef = fb.doc(fb.db,'investmentSubscriptions', s.id);
      const userRef = fb.doc(fb.db,'users', uid);

      let overrideReferrerUid = null, overrideAmt = 0;
      await fb.runTransaction(fb.db, async tx=>{
        const uSnap = await tx.get(userRef);
        const sSnap = await tx.get(subRef);
        if(!uSnap.exists() || !sSnap.exists()) return;
        const sd = sSnap.data();
        if(Number(sd.daysCredited||0) !== daysCredited) return; // already updated elsewhere, skip
        const ud = uSnap.data();

        tx.update(userRef,{
          mainBalance: Number(ud.mainBalance||0)+totalToCredit,
          totalRevenue: Number(ud.totalRevenue||0)+totalToCredit,
          updatedAt: fb.serverTimestamp()
        });
        tx.update(subRef,{
          daysCredited: newDaysCredited,
          totalCredited: Number(sd.totalCredited||0)+totalToCredit,
          lastCreditedAt: fb.serverTimestamp(),
          status: newDaysCredited >= duration ? 'completed' : 'active'
        });
        if(ud.referrerUid){
          overrideAmt = writeReferralOverride(fb, tx, ud.referrerUid, totalToCredit);
          if(overrideAmt>0) overrideReferrerUid = ud.referrerUid;
        }
      });

      await fb.addDoc(fb.collection(fb.db,'transactions'),{
        uid, type:'investment_income',
        title: daysToCredit>1 ? `Daily package earning — ${sub.packageName||''} (${daysToCredit} days)` : `Daily package earning — ${sub.packageName||''}`,
        amount:totalToCredit, createdAt:fb.serverTimestamp()
      });
      if(overrideReferrerUid && overrideAmt>0){
        await logReferralOverride(fb, overrideReferrerUid, overrideAmt, uid, `Package earning — ${sub.packageName||''}`);
      }
    }
    const freshSnap = await fb.getDoc(fb.doc(fb.db,'users',uid));
    if(freshSnap.exists()) applyFirebaseUserData(freshSnap.data());
  }catch(e){ console.warn('Investment income crediting failed',e); }
}

// Profile picture: uploaded once from the user's own gallery, resized and
// compressed client-side into a small square JPEG, then stored as a data
// URL on the user's Firestore doc (no separate Storage bucket needed).
// Once state.user.photoURL is set, the upload option no longer shows and
// this cannot be changed again.
function triggerAvatarUpload(){
  if(state.user.photoURL){ return; }
  document.getElementById('avatar-file-input')?.click();
}

async function handleAvatarFileSelect(event){
  const file = event.target.files && event.target.files[0];
  event.target.value = '';
  if(!file) return;

  if(state.user.photoURL){ toast('Profile picture already set and cannot be changed'); return; }

  if(!file.type.startsWith('image/')){ toast('Please choose an image file'); return; }
  if(file.size > 8*1024*1024){ toast('Image is too large — please choose a smaller one'); return; }

  try{
    const dataUrl = await resizeImageToDataUrl(file, 300, 0.75);
    await saveUserPatch({photoURL: dataUrl});
    state.user.photoURL = dataUrl;
    go('profile');
    toast('Profile picture saved');
  }catch(e){
    console.error('Avatar upload failed:', e);
    toast("Couldn't save profile picture, try again");
  }
}

function resizeImageToDataUrl(file, maxSize, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = () => reject(reader.error);
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('Could not read image'));
      img.onload = () => {
        // Crop to a centered square, then scale down to maxSize x maxSize
        // so the stored avatar stays small (a few tens of KB).
        const side = Math.min(img.width, img.height);
        const sx = (img.width - side)/2;
        const sy = (img.height - side)/2;
        const canvas = document.createElement('canvas');
        canvas.width = maxSize;
        canvas.height = maxSize;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, sx, sy, side, side, 0, 0, maxSize, maxSize);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

async function saveUserPatch(patch){
  const fb = await getFB();
  if(!fb) return;
  const user = await getCurrentUser(fb);
  if(!user) return;
  await fb.updateDoc(
    fb.doc(fb.db,'users',user.uid),
    {...patch,updatedAt:fb.serverTimestamp()}
  );
}

// Wraps a button click: disables it, shows a spinner in place of its label,
// runs the async action, then restores the button — regardless of outcome.
// Prevents double-submits and gives instant visual feedback on every action.
async function withButtonLoading(btn, fn){
  if(!btn) { await fn(); return; }
  if(btn.dataset.busy === '1') return;
  btn.dataset.busy = '1';
  const original = btn.innerHTML;
  const origWidth = btn.offsetWidth;
  btn.style.minWidth = origWidth + 'px';
  btn.disabled = true;
  btn.innerHTML = '<span class="btn-spin"></span>';
  try{
    await fn();
  } finally {
    btn.disabled = false;
    btn.innerHTML = original;
    btn.style.minWidth = '';
    btn.dataset.busy = '0';
  }
}

// Waits (quietly, no error toast) for Firebase to finish loading AND for the
// auth session to resolve to a real user. Used by every action button so a
// slow/backgrounded connection just keeps the button spinning instead of
// throwing a premature "please log in" error.
async function ensureReady(maxWaitMs){
  maxWaitMs = maxWaitMs || 30000;
  const fb = await getFB(maxWaitMs);
  if(!fb) return null;
  const user = await getCurrentUser(fb, maxWaitMs);
  if(!user) return null;
  return {fb, user};
}

function getFB(timeoutMs){
  timeoutMs = timeoutMs || 25000;
  if(window.apexifyFirebase) return Promise.resolve(window.apexifyFirebase);
  return new Promise(resolve=>{
    let done=false;
    const onReady = ()=>{ if(done) return; done=true; clearTimeout(t); resolve(window.apexifyFirebase); };
    window.addEventListener('apexify-fb-ready', onReady, {once:true});
    const t = setTimeout(()=>{
      if(done) return; done=true;
      window.removeEventListener('apexify-fb-ready', onReady);
      resolve(window.apexifyFirebase || null);
    }, timeoutMs);
  });
}
function getCurrentUser(fb, timeoutMs){
  timeoutMs = timeoutMs || 10000;
  return new Promise(resolve=>{
    if(fb.auth.currentUser){ resolve(fb.auth.currentUser); return; }
    let done=false;
    const unsub = fb.onAuthStateChanged(fb.auth, user=>{
      if(done) return; done=true;
      try{ unsub(); }catch(e){}
      if(!user) console.warn('[Apexify] getCurrentUser: onAuthStateChanged fired with no user — session appears lost.');
      resolve(user);
    });
    setTimeout(()=>{
      if(done) return; done=true;
      try{ unsub(); }catch(e){}
      const fallback = fb.auth.currentUser || null;
      if(!fallback) console.warn('[Apexify] getCurrentUser: timed out after '+timeoutMs+'ms with no user — Firebase Auth never resolved a session.');
      resolve(fallback);
    }, timeoutMs);
  });
}
function toast(msg){
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = `${iconCheck()}<span>${msg}</span>`;
  document.getElementById('modal-root').appendChild(t);

}

function chipClass(s){

function switchAuth(which){

let sessionRestoreAttempts = 0;
async function attemptSessionRestore(isManualRetry){
  const fb = window.apexifyFirebase;
  if(!fb || !fb.auth.currentUser) return;

  document.getElementById('login-view').classList.add('hidden');
  document.getElementById('register-view').classList.add('hidden');
  document.getElementById('session-restore-view').classList.remove('hidden');
  document.getElementById('session-restore-spinner').style.display = '';
  document.getElementById('session-restore-msg').textContent = 'Restoring session...';
  document.getElementById('session-retry-btn').classList.add('hidden');
  if(isManualRetry) sessionRestoreAttempts = 0;

  try{
    const ok = await loadCurrentUser();
    if(ok){
      hideBootSplash();
      document.getElementById('auth-screen').classList.add('hidden');
      document.getElementById('app-shell').classList.remove('hidden');
      go('home');
      return;
    }
    // loadCurrentUser resolved false (e.g. banned account, or no matching
    // account doc) — it already showed its own toast; fall back to login.
    document.getElementById('session-restore-view').classList.add('hidden');
    switchAuth('login');
    hideBootSplash();
  }catch(e){
    console.error('Session restore failed', e);
    sessionRestoreAttempts++;
    if(sessionRestoreAttempts < 3){
      // Almost always a transient network/cache hiccup right after a hard
      // refresh — NOT an actual logout. Retry quietly before giving up
      // (the boot splash stays up the whole time, so this is invisible).
      setTimeout(()=>attemptSessionRestore(false), 1500);
    }else{
      hideBootSplash();
      document.getElementById('session-restore-spinner').style.display = 'none';
      document.getElementById('session-restore-msg').textContent = "Can't connect. Check your internet and try again — your login is still saved, no need to enter your password.";
      document.getElementById('session-retry-btn').classList.remove('hidden');
    }
  }
}

  const fb = window.apexifyFirebase;
  document.getElementById('session-restore-view').classList.add('hidden');
  if(fb?.auth) fb.signOut(fb.auth).catch(()=>{});
  switchAuth('login');
}

function registrationErrorMessage(code){
  const messages={
    'auth/email-already-in-use':'An account already exists with this email',
    'auth/invalid-email':'Enter a valid email address',
    'auth/weak-password':'Please use a stronger password (at least 6 characters)',
    'auth/operation-not-allowed':'Email/Password sign-in is not enabled in Firebase Console',
    'auth/network-request-failed':'Internet/Firebase network connection issue',
    'auth/api-key-not-valid.-please-pass-a-valid-api-key.':'Invalid Firebase API key. Match the apiKey from your current Web App config in Firebase Console',
    'auth/api-key-not-valid':'Invalid Firebase API key. Match the apiKey from your current Web App config in Firebase Console',
    'auth/too-many-requests':'Too many attempts. Try again in a little while',
    'permission-denied':'Firestore rules are blocking registration',
    'failed-precondition':'Check your Firestore Database/Rules configuration',
    'unavailable':'Firestore is temporarily unavailable'
  };
  return messages[code] || `Registration failed: ${code || 'Unknown Firebase error'}`;
}

let verifyResendTimer=null;
function startResendCountdown(){
  const btn=document.getElementById('send-verify-btn');
  if(!btn) return;
  btn.disabled=true;
  if(verifyResendTimer) clearInterval(verifyResendTimer);
  verifyResendTimer=setInterval(()=>{
    const secs=Math.ceil((resendCooldownUntil-Date.now())/1000);
    if(secs<=0){
      clearInterval(verifyResendTimer);
      verifyResendTimer=null;
      btn.disabled=false;
      btn.textContent='Resend verification link';
    }else{
      btn.textContent=`Resend available in ${secs}s`;
    }
  },500);
}

// Sends (or re-sends) a verification link to the email typed in the
// registration form. Creates a temporary Firebase Auth account behind the
// scenes purely to send/confirm the link — no profile is created yet, so
// registration is not complete until "Complete registration" is pressed
// AND the link has been clicked.
async function sendVerificationLink(btn){
  const email=document.getElementById('reg-email').value.trim();
  const err=document.getElementById('reg-err');
  if(err) err.textContent='';

  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
    setVerifyStatus('Enter a valid email address first','#e05252');
    return;
  }

  if(Date.now() < resendCooldownUntil){
    return;
  }

  const fb = await getFB(30000);
  if(!fb){ setVerifyStatus('Check your internet connection and try again','#e05252'); return; }

  await withButtonLoading(btn, async ()=>{
    try{
      // Same email as an already-pending verification: just resend to the
      // same temp account instead of creating a duplicate.
      if(pendingVerification && pendingVerification.email===email && fb.auth.currentUser && fb.auth.currentUser.uid===pendingVerification.uid){
        await fb.sendEmailVerification(fb.auth.currentUser);
      }else{
        // Email changed (or first time) — clean up any previous temp
        // account before creating a new one for the new address.
        if(fb.auth.currentUser && !isPhoneLoginEmail(fb.auth.currentUser.email)){
          try{ await fb.deleteUser(fb.auth.currentUser); }catch(e){ try{ await fb.signOut(fb.auth); }catch(e2){} }
        }
        const tempPass = 'tmp-' + Math.random().toString(36).slice(2) + Date.now();
        const cred = await fb.createUserWithEmailAndPassword(fb.auth, email, tempPass);
        await fb.sendEmailVerification(cred.user);
        pendingVerification = {uid:cred.user.uid, email};
      }

      resendCooldownUntil = Date.now() + 30000;
      setVerifyStatus(`Verification link sent to ${email}. Check your inbox, click the link, then complete registration below.`,'var(--text-mute)');
      startResendCountdown();

    }catch(e){
      console.error('Send verification failed:', e);
      const code=e?.code||'';
      if(code==='auth/email-already-in-use'){
        setVerifyStatus('An account already exists with this email','#e05252');
      }else{
        setVerifyStatus(registrationErrorMessage(code),'#e05252');
      }
    }
  });
}

async function doRegister(btn){
  const name=document.getElementById('reg-name').value.trim();
  const phone=normalizePhone(document.getElementById('reg-phone').value.trim());
  const email=document.getElementById('reg-email').value.trim();
  const referral=(document.getElementById('reg-referral').value.trim() || getReferralFromUrl()).toUpperCase();
  const pass=document.getElementById('reg-pass').value;
  const pass2=document.getElementById('reg-pass2').value;
  const err=document.getElementById('reg-err');
  if(err) err.textContent='';

  if(!name || !phone || !email || !pass || !pass2){
    toast('Please fill in all fields'); return;
  }

  // Bangladesh mobile validation for this phone-as-login system.
  if(!/^01[3-9]\d{8}$/.test(phone)){
    toast('Enter a valid 11-digit mobile number'); return;
  }

  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
    toast('Enter a valid email address'); return;
  }

  if(pass.length < 6){
    toast('Password must be at least 6 characters'); return;
  }

  if(pass !== pass2){
    toast('Passwords do not match'); return;
  }

  if(!pendingVerification || pendingVerification.email!==email){
    if(err) err.textContent='Please send a verification link to this email first';
    return;
  }

  const fb = await getFB(30000);
  if(!fb){ toast('Check your internet connection and try again'); return; }

  if(!fb.auth.currentUser || fb.auth.currentUser.uid!==pendingVerification.uid){
    if(err) err.textContent='Verification session lost — please send the link again';
    return;
  }

  await withButtonLoading(btn, async ()=>{
    try{
      await fb.reload(fb.auth.currentUser);

      if(!fb.auth.currentUser.emailVerified){
        if(err) err.textContent='Please verify your email first — click the link we sent, then try again';
        return;
      }

      const authEmail = phoneAuthEmail(phone);

      // Verified: retire the temporary real-email account and create the
      // actual phone-login account in its place. Firebase's email
      // enumeration protection blocks direct email swaps on an existing
      // account (updateEmail), so a fresh account is created instead.
      try{
        await fb.deleteUser(fb.auth.currentUser);
      }catch(e){
        console.warn('Could not delete temp verification account, signing out instead:', e);
        try{ await fb.signOut(fb.auth); }catch(e2){}
      }

      let finalUser=null;
      try{
        const cred = await fb.createUserWithEmailAndPassword(fb.auth, authEmail, pass);
        finalUser = cred.user;
      }catch(e){
        console.error('Final account creation failed:', e);
        if(e?.code==='auth/email-already-in-use'){
          if(err) err.textContent='An account already exists with this mobile number — please log in';
        }else if(e?.code==='auth/weak-password'){
          if(err) err.textContent='Please use a stronger password (at least 6 characters)';
        }else{
          if(err) err.textContent='Could not create account, please try again';
        }
        return;
      }

      try{
        await createFirestoreUser(finalUser.uid, name, phone, referral, email, true);
      }catch(e){
        console.error('Firestore profile creation failed after verification:', e);
        try{
          if(fb.auth.currentUser && fb.auth.currentUser.uid===finalUser.uid) await fb.deleteUser(finalUser);
        }catch(e2){}
        if(err) err.textContent='Could not create your profile, please try again';
        return;
      }

      pendingVerification = null;
      await fb.signOut(fb.auth);

      toast('Account created — please log in now');
      document.getElementById('login-phone').value=phone;
      document.getElementById('login-pass').value='';
      setVerifyStatus('');
      switchAuth('login');

    }catch(e){
      console.error('Apexify registration error:', e);
      const code=e?.code || '';
      toast(registrationErrorMessage(code));
      console.error('Firebase error code:', code);
      console.error('Firebase error message:', e?.message || e);
    }
  });
}

async function logout(){
  const fb = await getFB();
  try{ if(fb?.auth) await fb.signOut(fb.auth); }catch(e){ console.warn(e); }
  if(firebaseUnsubUser) { firebaseUnsubUser(); firebaseUnsubUser=null; }
  document.getElementById('app-shell').classList.add('hidden');
  document.getElementById('auth-screen').classList.remove('hidden');
  switchAuth('login');
}

function go(view, opts){
  currentView = view;
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active', b.dataset.nav===view));
  const main = document.getElementById('main-content');
  try{
    if(LOCKED_VIEWS.includes(view) && state.user.status!=='active'){
      main.innerHTML = lockedScreen(VIEW_TITLES[view] || '');
    } else {
      main.innerHTML = renderers[view] ? renderers[view](opts) : `<div class="empty-state">${iconClock()}<b>Coming soon</b></div>`;
    }
  }catch(e){
    // A rendering bug used to leave the screen frozen with no feedback at
    // all (e.g. the missing esc() helper). Fail loudly instead so a broken
    // screen is obvious and reportable rather than silently doing nothing.
    console.error('Render failed for view:', view, e);
    main.innerHTML = `<div class="empty-state">${iconClock()}<b>Something went wrong loading this page</b><span>Please try again or contact support.</span></div>`;
    toast("Couldn't load this page");
  }
  main.scrollTop = 0;
  window.scrollTo(0,0);
}

async function submitRedeem(btn){
  const codeRaw = document.getElementById('redeem-code').value.trim();
  const err = document.getElementById('redeem-err');
  if(!codeRaw){ err.textContent = 'Enter a code'; return; }

  await withButtonLoading(btn, async ()=>{
    const ctx = await ensureReady();
    if(!ctx){ err.textContent = 'Check your internet connection and try again'; return; }
    const {fb, user} = ctx;
    const code = codeRaw.toUpperCase();
    const uid = user.uid;
    err.textContent = '';

    try{
      const dupSnap = await fb.getDocs(fb.query(
        fb.collection(fb.db,'redemptions'), fb.where('uid','==',uid), fb.where('code','==',code), fb.limit(1)
      ));
      if(!dupSnap.empty){ err.textContent = "You've already used this code"; return; }

      const codeRef = fb.doc(fb.db,'redeemCodes',code);
      let amount = 0;
      await fb.runTransaction(fb.db, async tx=>{
        const snap = await tx.get(codeRef);
        if(!snap.exists()) throw new Error('invalid');
        const d = snap.data();
        if(d.active===false) throw new Error('inactive');
        if(d.expiresAt?.toDate && d.expiresAt.toDate() < new Date()) throw new Error('expired');
        if(typeof d.maxUses==='number' && Number(d.usedCount||0) >= d.maxUses) throw new Error('limit');
        amount = Number(d.amount||0);
        const userRef = fb.doc(fb.db,'users',uid);
        const uSnap = await tx.get(userRef);
        const u = uSnap.data();

        tx.update(codeRef,{usedCount:Number(d.usedCount||0)+1});
        tx.update(userRef,{
          mainBalance:Number(u.mainBalance||0)+amount,
          totalRevenue:Number(u.totalRevenue||0)+amount,
          updatedAt:fb.serverTimestamp()
        });
      });
      await fb.addDoc(fb.collection(fb.db,'redemptions'),{uid, code, amount, createdAt:fb.serverTimestamp()});
      await fb.addDoc(fb.collection(fb.db,'transactions'),{uid, type:'redeem', title:'Redeem code', amount, createdAt:fb.serverTimestamp()});
      state.user.mainBalance = Number(state.user.mainBalance||0)+amount;
      state.user.totalRevenue = Number(state.user.totalRevenue||0)+amount;
      document.getElementById('redeem-code').value='';
      toast(`Code claimed successfully, ৳${fmt(amount)} added`);
      go('redeem');
    }catch(e){
      const map = {invalid:'Invalid code', inactive:'This code is disabled', expired:'This code has expired', limit:'This code has reached its usage limit'};
      err.textContent = map[e.message] || "Couldn't use this code";
    }
  });
}

async function submitWithdraw(btn){
  const amt = Number(document.getElementById('withdraw-amt').value);
  const minWd = Number(firebaseSettings.minWithdraw || 100);
  const maxWd = Number(firebaseSettings.maxWithdraw || 20000);
  if((firebaseSettings.withdrawPolicy||'all')==='subscribers_only' && !state.user.hasPurchasedPackage && !state.mySubscriptions.length){
    toast('You need to buy any subscription package before withdrawing');
    return;
  }
  if(!amt || amt < minWd){ toast(`Minimum withdrawal is ৳${fmt(minWd)}`); return; }
  if(amt > maxWd){ toast(`Maximum withdrawal is ৳${fmt(maxWd)}`); return; }
  if(!state.user.bkashNumber && !state.user.nagadNumber){ toast('Add a wallet first'); return; }

  await withButtonLoading(btn, async ()=>{
    const ctx = await ensureReady();
    if(!ctx){ toast('Check your internet connection and try again'); return; }
    const {fb, user} = ctx;

    const uid = user.uid;
    let walletType, walletNumber;
    if(state.user.bkashNumber && state.user.nagadNumber){
      const choice = document.getElementById('withdraw-wallet-choice').value;
      walletType = choice==='bkash' ? 'bKash' : 'Nagad';
      walletNumber = choice==='bkash' ? state.user.bkashNumber : state.user.nagadNumber;
    }else if(state.user.bkashNumber){
      walletType = 'bKash'; walletNumber = state.user.bkashNumber;
    }else{
      walletType = 'Nagad'; walletNumber = state.user.nagadNumber;
    }
    const fee = Math.round(amt*(Number(firebaseSettings.withdrawFeePercent ?? 2)/100));
    const net = amt-fee;
    const userRef = fb.doc(fb.db,'users',uid);

    try{
      await fb.runTransaction(fb.db, async tx=>{
        const snap = await tx.get(userRef);
        if(!snap.exists()) throw new Error('no-user');
        const bal = Number(snap.data().mainBalance||0);
        if(bal < amt) throw new Error('insufficient');
        tx.update(userRef,{mainBalance: bal-amt, updatedAt: fb.serverTimestamp()});
      });
    }catch(e){
      toast(e.message==='insufficient' ? 'Insufficient balance' : 'Request failed');
      return;
    }

    try{
      await fb.addDoc(fb.collection(fb.db,'withdrawalRequests'),{
        uid, amount:amt, fee, netAmount:net,
        walletType, walletNumber,
        status:'pending', createdAt:fb.serverTimestamp()
      });
      state.user.mainBalance = Number(state.user.mainBalance||0)-amt;
      toast('Withdrawal request sent');
      await loadUserCollections();
      go('withdraw');
    }catch(e){
      console.error(e);
      toast('Failed to save request, contact support');
    }
  });
}

let currentTaskProofImage = null;
function compressImageFile(file, maxWidth, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > maxWidth){ h = Math.round(h * maxWidth/w); w = maxWidth; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = ()=>reject(new Error('image-decode-failed'));
      img.src = e.target.result;
    };
    reader.onerror = ()=>reject(new Error('file-read-failed'));
    reader.readAsDataURL(file);
  });
}
async function compressImageForUpload(file){
  let quality = 0.7, maxWidth = 900;
  let dataUrl = await compressImageFile(file, maxWidth, quality);
  while(dataUrl.length > 700000 && quality > 0.3){
    quality -= 0.15;
    dataUrl = await compressImageFile(file, maxWidth, quality);
  }
  if(dataUrl.length > 700000){
    dataUrl = await compressImageFile(file, 600, 0.5);
  }
  return dataUrl;
}
async function handleTaskProofImage(input){
  const file = input.files[0];
  if(!file) return;
  const wrap = document.getElementById('task-proof-preview-wrap');
  wrap.innerHTML = `<div style="display:flex;align-items:center;gap:8px;color:var(--text-mute);font-size:12.5px; padding:8px 0;"><div class="spinner" style="width:16px;height:16px;border-width:2px;"></div> Processing image...</div>`;
  try{
    currentTaskProofImage = await compressImageForUpload(file);
    wrap.innerHTML = `
      <div style="position:relative; display:inline-block; max-width:100%;">
        <img src="${currentTaskProofImage}" style="width:100%; max-height:200px; object-fit:cover; border-radius:12px; border:1px solid var(--border); display:block;">
        <button type="button" onclick="removeTaskProofImage()" style="position:absolute; top:8px; right:8px; background:rgba(0,0,0,.6); color:#fff; border:none; border-radius:99px; width:28px; height:28px; font-size:14px; line-height:1;">✕</button>
      </div>`;
  }catch(e){
    console.error(e);
    currentTaskProofImage = null;
    wrap.innerHTML = `<button type="button" class="btn btn-outline btn-block" onclick="document.getElementById('task-proof-file').click()">Choose image</button>`;
    toast("Couldn't process image, try again");
  }
}

  currentTaskProofImage = null;
  const fileInput = document.getElementById('task-proof-file');

async function submitTaskProof(taskId, btn){
  const proof = document.getElementById('task-proof').value.trim();
  const err = document.getElementById('task-submit-err');
  if(!currentTaskProofImage){ err.textContent='Upload a proof screenshot'; return; }
  err.textContent='';

  const t = state.tasks.find(x=>x.id===taskId);
  if(!t){ toast('Task not found'); return; }

  await withButtonLoading(btn, async ()=>{
    const ctx = await ensureReady();
    if(!ctx){ err.textContent='Check your internet connection and try again'; return; }
    const {fb, user} = ctx;

    try{
      const dupSnap = await fb.getDocs(fb.query(
        fb.collection(fb.db,'taskSubmissions'), fb.where('uid','==',user.uid), fb.where('taskId','==',taskId), fb.limit(1)
      ));
      if(!dupSnap.empty && dupSnap.docs[0].data().status!=='rejected'){
        err.textContent='This task has already been submitted'; return;
      }

      await fb.addDoc(fb.collection(fb.db,'taskSubmissions'),{
        uid:user.uid, taskId, taskTitle:t.title, reward:Number(t.reward||0),
        proof, proofImage:currentTaskProofImage, status:'pending', createdAt:fb.serverTimestamp()
      });
      currentTaskProofImage = null;
      toast('Task submitted, admin is reviewing');
      closeModal();
      await loadUserCollections();
      go('task');
    }catch(e){
      console.error(e);
      err.textContent = e?.code==='resource-exhausted' || /longer than/i.test(e?.message||'')
        ? 'Image is too large, try a smaller/lighter image'
        : "Couldn't submit, try again";
    }
  });
}

        <div class="kv-row"><span>Referral commission</span><b>৳${fmt(Number(firebaseSettings.referralCommission || 15))}</b></div>
        <div class="kv-row"><span>Referral income bonus</span><b>${Number(firebaseSettings.referralOverridePercent ?? 5)}%</b></div>
        <div class="kv-row"><span>Daily free income</span><b>৳${fmt(Number(firebaseSettings.dailyFreeIncome || 30))}</b></div>
      </div>
      <button class="btn btn-primary btn-block" style="margin-top:16px" onclick="submitActivationRequest(this)">Send activation request</button>
      <button class="btn btn-outline btn-block" style="margin-top:10px" onclick="closeModal();openDeposit()">No balance? Deposit</button>
      <p class="plan-note">As soon as you send the request, the fee will be deducted from your deposit balance. If admin approves, your account will be activated; if rejected, the amount will be refunded.</p>
    </div>
  </div>`);
}

async function buySubscription(){ await submitActivationRequest(); }

let depositAmount = 0;

function depositLogoSvg(method){
  if(method==='bKash'){
    return `<svg width="30" height="30" viewBox="0 0 30 30" xmlns="http://www.w3.org/2000/svg"><rect width="30" height="30" rx="8" fill="#E2136E"/><text x="15" y="21" font-size="16" font-weight="800" fill="#fff" text-anchor="middle" font-family="Arial, sans-serif">b</text></svg>`;
  }
  return `<svg width="30" height="30" viewBox="0 0 30 30" xmlns="http://www.w3.org/2000/svg"><rect width="30" height="30" rx="8" fill="#F6821F"/><text x="15" y="21" font-size="14" font-weight="800" fill="#fff" text-anchor="middle" font-family="Arial, sans-serif">N</text></svg>`;
}

async function openDeposit(){
  openModal(`
  <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <h3>Deposit</h3>
      <p class="desc">Choose a payment method and enter the amount you want to deposit.</p>

      <div class="dep-method-grid">
        <div class="dep-method-item ${selectedDepositMethod==='bKash'?'active':''}" onclick="selectDepositMethod('bKash', this)">
          <div class="dep-method-logo">${depositLogoSvg('bKash')}</div>
          <span>bKash</span>
        </div>
        <div class="dep-method-item ${selectedDepositMethod==='Nagad'?'active':''}" onclick="selectDepositMethod('Nagad', this)">
          <div class="dep-method-logo">${depositLogoSvg('Nagad')}</div>
          <span>Nagad</span>
        </div>
      </div>

      <div class="field">
        <label>Deposit amount</label>
        <div class="field-input"><span style="color:var(--text-mute);font-weight:700">৳</span><input id="deposit-amount" type="number" min="1" placeholder="e.g. 500" value="${depositAmount?depositAmount:''}"></div>
        <div style="font-size:11px; color:var(--text-mute); margin-top:6px">Limit: ৳${fmt(Number(firebaseSettings.minDeposit||50))} – ৳${fmt(Number(firebaseSettings.maxDeposit||50000))}</div>
      </div>

      <div class="err-msg" id="deposit-err"></div>
      <button class="btn btn-primary btn-block" onclick="goToDepositStep2()">Next</button>
    </div>
  </div>`);
}

function selectDepositMethod(method, el){
  selectedDepositMethod = method;
  document.querySelectorAll('.dep-method-item').forEach(item=>item.classList.remove('active'));
  el?.classList.add('active');
}

function goToDepositStep2(){
  const amount = Number(document.getElementById('deposit-amount')?.value || 0);
  const err = document.getElementById('deposit-err');
  const minDep = Number(firebaseSettings.minDeposit || 50);
  const maxDep = Number(firebaseSettings.maxDeposit || 50000);
  if(!amount || amount < 1){ err.textContent='Enter deposit amount'; return; }
  if(amount < minDep){ err.textContent=`Minimum deposit is ৳${fmt(minDep)}`; return; }
  if(amount > maxDep){ err.textContent=`Maximum deposit is ৳${fmt(maxDep)}`; return; }
  err.textContent='';
  depositAmount = amount;
  openDepositStep2();
}

function openDepositStep2(){
  const method = selectedDepositMethod;
  const number = method==='bKash' ? '01403594918' : '01403593914';
  openModal(`
  <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <h3>Send Payment</h3>
      <div style="display:flex; align-items:center; gap:10px; margin-bottom:14px;">
        <div class="dep-method-logo">${depositLogoSvg(method)}</div>
        <div>
          <b style="display:block;font-size:14px;">${method}</b>
          <span style="font-size:12px;color:var(--text-mute);">Amount: ৳${fmt(depositAmount)}</span>
        </div>
      </div>

      <div class="card" style="padding:13px;margin-bottom:12px;">
        <div style="font-size:12px;color:var(--text-mute);margin-bottom:6px;">Send money to this ${method} number</div>
        <div class="dep-number-box">
          <b>${number}</b>
          <button class="btn btn-outline btn-sm" onclick="copyDepositNumber('${number}')">Copy</button>
        </div>
      </div>

      <div class="card" style="padding:11px 13px; margin-bottom:14px; background:var(--warn-soft, rgba(240,185,78,.1)); border:1px solid rgba(240,185,78,.3);">
        <b style="display:block; font-size:12.5px; color:var(--warn, #C68A1F); margin-bottom:3px;">⚠️ Payment note</b>
        <span style="font-size:11.5px; color:var(--text-mute);">You must send the payment to this ${method} number. Use "Send Money" only — sending via "Payment" or "Cash Out" cannot be verified.</span>
      </div>

      <div class="field">
        <label>Transaction ID</label>
        <div class="field-input"><input id="deposit-txid" type="text" maxlength="80" placeholder="Enter Transaction ID"></div>
      </div>

      <div class="err-msg" id="deposit-err"></div>
      <button class="btn btn-primary btn-block" onclick="submitDeposit(this)">Submit</button>
      <button class="btn btn-ghost btn-block" style="margin-top:8px" onclick="openDeposit()">Back</button>
      <p class="plan-note">Only enter the Transaction ID of a real transaction. The amount won't be added to your balance until it's verified.</p>
    </div>
  </div>`);
}

function copyDepositNumber(num){
  navigator.clipboard?.writeText(num).then(()=>toast('Payment number copied')).catch(()=>toast(num));
}

async function submitDeposit(btn){
  const method = selectedDepositMethod;
  const amount = depositAmount;
  const txid = document.getElementById('deposit-txid')?.value.trim();
  const err = document.getElementById('deposit-err');

  if(!amount || amount < 1){ err.textContent='Enter deposit amount'; return; }
  if(!txid){ err.textContent='Enter Transaction ID'; return; }

  err.textContent='';
  await withButtonLoading(btn, async ()=>{
    const ctx = await ensureReady();
    if(!ctx){ err.textContent='Check your internet connection and try again'; return; }
    const {fb, user} = ctx;
    try{
      const uid = user.uid;
      await fb.addDoc(fb.collection(fb.db,'depositRequests'),{
        uid,
        method,
        receiverNumber: method==='bKash' ? '01403594918' : '01403593914',
        amount,
        transactionId:txid,
        status:'pending',
        createdAt:fb.serverTimestamp()
      });
      depositAmount = 0;
      closeModal();
      toast('Deposit request submitted. Balance will be added after verification');
    }catch(e){
      console.error(e);
      err.textContent="Couldn't submit request. Try again";
    }
  });
}

async function updateStatus(newStatus){
  state.user.status = newStatus;
  await persistStatus();
}


function openEditProfile(){
  openModal(`
  <div class="modal-overlay" onclick="if(event.target===this) closeModal()">

      <div class="sheet-handle"></div>

async function saveProfile(){

  if(!name){ toast('Enter a name'); return; }
  try{
    state.user.name = name;
    state.user.avatarInitial = name[0];
    await saveUserPatch({name});
    closeModal();
    go('profile');
    toast('Profile updated');
  }catch(e){
    console.error(e);
    toast("Couldn't update profile");
  }
}

/* Init: start on login (hidden behind the boot splash until we know the
   real auth state, so a returning logged-in user never sees a flash of
   the login form before the app shell appears). */
switchAuth('login');

function hideBootSplash(){
  const el = document.getElementById('boot-splash');
  if(el) el.classList.add('hidden');
}
// Safety net: never leave someone stuck behind the splash forever if
// Firebase fails to initialize (e.g. network totally blocked).
setTimeout(()=>{
  const el = document.getElementById('boot-splash');
  if(el && !el.classList.contains('hidden')){
    hideBootSplash();
    switchAuth('login');
  }
}, 8000);

(async function initFirebaseSession(){
  if(!window.apexifyFirebase){
    await new Promise(resolve => window.addEventListener('apexify-fb-ready', resolve, {once:true}));
  }
  const fb=window.apexifyFirebase;
  if(!fb){ hideBootSplash(); return; }

  try{
    await loadFirebaseSettings();

    fb.onAuthStateChanged(fb.auth, async user=>{
      if(!user){ hideBootSplash(); return; }

      // A signed-in account whose Auth email is still the real address
      // (a temporary verification-only account) means the person left
      // mid-registration before finishing on the registration form. Bring
      // them back to the registration screen with the email pre-filled and
      // status restored, instead of trying to load a full profile.
      if(!isPhoneLoginEmail(user.email)){
        hideBootSplash();
        pendingVerification = {uid:user.uid, email:user.email};
        try{
          await fb.reload(user);
        }catch(e){}
        switchAuth('register');
        const emailInput=document.getElementById('reg-email');
        if(emailInput) emailInput.value=user.email;
        if(user.emailVerified){
          setVerifyStatus(`${user.email} is verified. Fill in the rest of the form and press Complete registration.`,'#10B981');
        }else{
          setVerifyStatus(`A verification link was already sent to ${user.email}. Click it, then press Complete registration below.`,'var(--text-mute)');
        }
        return;
      }

      attemptSessionRestore(false);
    });
  }catch(e){
    console.error('Firebase init failed',e);
    hideBootSplash();
  }

  const ref=getReferralFromUrl();
  const refInput=document.getElementById('reg-referral');
  if(ref && refInput) refInput.value=ref;
})();
</script>

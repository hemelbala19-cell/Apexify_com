<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apexify - Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Hind Siliguri', sans-serif; }
        body { background-color: #f4f7f6; color: #333; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 10px; }
        
        .admin-container { width: 100%; max-width: 480px; background: #fff; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); overflow: hidden; display: flex; flex-direction: column; height: 90vh; }
        
        .admin-header { background: #00875a; color: #fff; padding: 20px; text-align: center; font-size: 20px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; }
        
        .admin-body { padding: 20px; overflow-y: auto; flex: 1; }

        .section-title { font-size: 16px; font-weight: 700; color: #00875a; margin-bottom: 15px; border-bottom: 2px solid #eef6f6; padding-bottom: 8px; display: flex; align-items: center; gap: 8px; }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: #4b5563; margin-bottom: 6px; }
        .form-control { width: 100%; padding: 12px 15px; border: 1px solid #d1d5db; border-radius: 10px; font-size: 14px; outline: none; background: #f9fafb; transition: all 0.3s; }
        .form-control:focus { border-color: #00875a; background: #fff; box-shadow: 0 0 0 3px rgba(0, 135, 90, 0.1); }

        .save-btn { background: #00875a; color: #fff; width: 100%; border: none; padding: 14px; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.3s; margin-top: 5px; box-shadow: 0 4px 10px rgba(0, 135, 90, 0.2); }
        .save-btn:hover { background: #006c48; }

        .pending-section { margin-top: 25px; }
        .deposit-card { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 12px; padding: 15px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .deposit-info h4 { font-size: 14px; color: #111; margin-bottom: 3px; }
        .deposit-info p { font-size: 12px; color: #6b7280; margin-bottom: 2px; }
        
        .approve-btn { background: #00875a; color: #fff; border: none; padding: 8px 15px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>

    <div class="admin-container">
        <div class="admin-header">
            <i class="fa-solid fa-shield-halved"></i> Apexify Admin Panel
        </div>

        <div class="admin-body">
            <!-- সেটিংস সেকশন -->
            <div class="section-title">
                <i class="fa-solid fa-gear"></i> একাউন্ট ও পেমেন্ট সেটিংস
            </div>

            <div class="form-group">
                <label>অ্যাক্টিভেশন ফি (টাকা)</label>
                <input type="number" id="settingFee" class="form-control" placeholder="যেমন: 150">
            </div>

            <div class="form-group">
                <label>প্রতি রেফার বোনাস (টাকা)</label>
                <input type="number" id="settingRefBonus" class="form-control" placeholder="যেমন: 20">
            </div>

            <div class="form-group">
                <label>বিকাশ নাম্বার</label>
                <input type="text" id="settingBkash" class="form-control" placeholder="01XXXXXXXXX">
            </div>

            <div class="form-group">
                <label>নগদ নাম্বার</label>
                <input type="text" id="settingNagad" class="form-control" placeholder="01XXXXXXXXX">
            </div>

            <button class="save-btn" onclick="saveSettings()">সেটিংস সেভ করুন</button>

            <!-- পেন্ডিং ডিপোজিট সেকশন -->
            <div class="pending-section">
                <div class="section-title">
                    <i class="fa-solid fa-list-check"></i> পেন্ডিং ডিপোজিট রিকোয়েস্ট
                </div>
                <div id="pendingList">
                    <p style="font-size: 13px; color: #6b7280; text-align: center;">কোনো রিকোয়েস্ট নেই...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc, collection, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDsgQJgZ64-ARLqKa3vcdQpu_xVupD90W4",
            authDomain: "apexify-72bc2.firebaseapp.com",
            projectId: "apexify-72bc2",
            storageBucket: "apexify-72bc2.firebasestorage.app",
            messagingSenderId: "114061131405",
            appId: "1:114061131405:web:ffd00b701d70c164976cc4",
            measurementId: "G-RB6KW4S7JL"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // পুরনো সেটিংস লোড করা
        async function loadSettings() {
            try {
                let docSnap = await getDoc(doc(db, "settings", "general"));
                if (docSnap.exists()) {
                    let data = docSnap.data();
                    if(data.fee) document.getElementById('settingFee').value = data.fee;
                    if(data.refBonus) document.getElementById('settingRefBonus').value = data.refBonus;
                    if(data.bkash) document.getElementById('settingBkash').value = data.bkash;
                    if(data.nagad) document.getElementById('settingNagad').value = data.nagad;
                }
            } catch(e) {
                console.log(e);
            }
        }
        loadSettings();

        // সেটিংস সেভ করার ফাংশন
        window.saveSettings = async function() {
            let fee = document.getElementById('settingFee').value;
            let refBonus = document.getElementById('settingRefBonus').value;
            let bkash = document.getElementById('settingBkash').value;
            let nagad = document.getElementById('settingNagad').value;

            try {
                await setDoc(doc(db, "settings", "general"), {
                    fee: fee,
                    refBonus: refBonus,
                    bkash: bkash,
                    nagad: nagad
                }, { merge: true });
                alert('সেটিংস সফলভাবে সেভ হয়েছে!');
            } catch(e) {
                alert('এরর: ' + e.message);
            }
        }

        // পেন্ডিং ডিপোজিট ফেচ করা
        async function fetchPendingDeposits() {
            let listContainer = document.getElementById('pendingList');
            listContainer.innerHTML = '<p style="font-size: 13px; color: #6b7280; text-align: center;">লোড হচ্ছে...</p>';
            
            try {
                let querySnapshot = await getDocs(collection(db, "pending_deposits"));
                listContainer.innerHTML = '';
                
                if(querySnapshot.empty) {
                    listContainer.innerHTML = '<p style="font-size: 13px; color: #6b7280; text-align: center;">কোনো পেন্ডিং ডিপোজিট নেই</p>';
                    return;
                }

                querySnapshot.forEach((document) => {
                    let item = document.data();
                    let docId = document.id;
                    
                    listContainer.innerHTML += `
                        <div class="deposit-card">
                            <div class="deposit-info">
                                <h4>ইউজার: ${item.userId || 'N/A'}</h4>
                                <p>মাধ্যম: <strong>${item.method.toUpperCase()}</strong> | এমাউন্ট: ৳${item.amount}</p>
                                <p>TrxID: <span style="color:#00875a; font-weight:bold;">${item.trx}</span></p>
                            </div>
                            <button class="approve-btn" onclick="approveDep('${docId}', '${item.userId}')">অ্যাপ্রুভ</button>
                        </div>
                    `;
                });
            } catch(e) {
                listContainer.innerHTML = '<p style="font-size: 13px; color: red; text-align: center;">ডেটা লোড করতে সমস্যা হয়েছে</p>';
            }
        }
        fetchPendingDeposits();

        // ডিপোজিট অ্যাপ্রুভ করার ফাংশন
        window.approveDep = async function(docId, userId) {
            try {
                // ইউজারের স্ট্যাটাস Active করা
                await setDoc(doc(db, "users", userId), { status: "Active" }, { merge: true });
                
                // রিকোয়েস্ট ডিলিট করা
                await deleteDoc(doc(db, "pending_deposits", docId));
                
                alert('ডিপোজিট সফলভাবে অ্যাপ্রুভ করা হয়েছে!');
                fetchPendingDeposits();
            } catch(e) {
                alert('এরর: ' + e.message);
            }
        }
    </script>
</body>
</html>

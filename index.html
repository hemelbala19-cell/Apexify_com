<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Apexify — Earn from real tasks & VIP Packages</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#08211D;
    --bg-2:#0C2B25;
    --surface:#0F332C;
    --surface-2:#154339;
    --surface-3:#1B5245;
    --line: rgba(163, 224, 202, 0.12);
    --primary:#19E3A6;
    --primary-dim:#0FBE8C;
    --primary-soft: rgba(25,227,166,0.14);
    --gold:#E8C468;
    --text:#EAF7F1;
    --text-muted:#8FB6A9;
    --text-faint:#5E8478;
    --danger:#FF7A7A;
    --danger-soft: rgba(255,122,122,0.12);
    --radius: 18px;
    --radius-sm: 12px;
    --font-display: 'Space Grotesk', sans-serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
    --shadow-lift: 0 10px 30px rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family: var(--font-body);
    background: radial-gradient(1200px 800px at 20% -10%, #103A32 0%, var(--bg) 55%), var(--bg);
    color: var(--text);
    min-height:100vh;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  #bg-orbs{position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden;}
  .orb{position:absolute; border-radius:50%; filter:blur(70px); opacity:0.35; animation: float 18s ease-in-out infinite;}
  .orb1{width:340px; height:340px; background:var(--primary); top:-100px; left:-80px; animation-delay:0s;}
  .orb2{width:280px; height:280px; background:var(--gold); bottom:-60px; right:-60px; opacity:0.18; animation-delay:4s;}
  .orb3{width:220px; height:220px; background:#1B5245; top:40%; right:10%; opacity:0.4; animation-delay:8s;}
  @keyframes float{
    0%,100%{ transform: translate(0,0) scale(1); }
    50%{ transform: translate(20px,-30px) scale(1.08); }
  }
  #app{position:relative; z-index:1; max-width:480px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column;}
  ::selection{ background: var(--primary); color:#04140F; }

  a{color:inherit; text-decoration:none;}
  button{font-family:inherit; cursor:pointer; border:none;}
  input, select{font-family:inherit;}

  h1,h2,h3{ font-family: var(--font-display); letter-spacing:-0.02em; }
  .eyebrow{ font-family: var(--font-mono); font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--primary); }
  .mono{ font-family: var(--font-mono); }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    padding:15px 22px; border-radius: 999px; font-weight:600; font-size:15px;
    transition: transform .18s cubic-bezier(.2,.8,.2,1), box-shadow .18s, background .18s, opacity .18s;
    position:relative; overflow:hidden;
  }
  .btn:active{ transform: scale(0.96); }
  .btn-primary{
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dim) 100%);
    color:#04140F; box-shadow: 0 8px 24px rgba(25,227,166,0.28);
  }
  .btn-primary:hover{ box-shadow: 0 10px 30px rgba(25,227,166,0.42); transform: translateY(-1px); }
  .btn-ghost{
    background: var(--surface-2); color:var(--text); border:1px solid var(--line);
  }
  .btn-ghost:hover{ background: var(--surface-3); }
  .btn-block{ width:100%; }
  .btn-sm{ padding:10px 16px; font-size:13px; }
  .btn[disabled]{ opacity:0.5; pointer-events:none; }

  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:13px; color:var(--text-muted); margin-bottom:7px; font-weight:500; }
  .field input, .field select{
    width:100%; padding:14px 16px; background: var(--surface-2); border:1px solid var(--line);
    border-radius: var(--radius-sm); color:var(--text); font-size:15px; transition: border-color .15s, box-shadow .15s;
  }
  .field input:focus, .field select:focus{
    outline:none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft);
  }
  .field input::placeholder{ color: var(--text-faint); }

  .card{
    background: linear-gradient(180deg, var(--surface) 0%, var(--surface) 100%);
    border:1px solid var(--line); border-radius: var(--radius); padding:20px;
  }
  .card-glow{ box-shadow: var(--shadow-lift); }

  .screen{ flex:1; display:flex; flex-direction:column; padding: 28px 22px 100px; animation: rise .45s cubic-bezier(.2,.8,.2,1); }
  @keyframes rise{ from{ opacity:0; transform: translateY(14px);} to{opacity:1; transform:translateY(0);} }

  .bottomnav{
    position:fixed; left:50%; transform:translateX(-50%); bottom:16px; width:calc(100% - 32px); max-width:448px;
    background: rgba(15,51,44,0.9); backdrop-filter: blur(16px); border:1px solid var(--line);
    border-radius: 20px; display:flex; justify-content:space-around; padding:10px 6px; z-index:20;
    box-shadow: 0 14px 40px rgba(0,0,0,0.4);
  }
  .navitem{
    display:flex; flex-direction:column; align-items:center; gap:4px; padding:8px 8px; border-radius:12px;
    color: var(--text-faint); font-size:10px; font-weight:600; transition: color .2s, transform .2s;
    background:none;
  }
  .navitem svg{ width:20px; height:20px; transition: transform .2s; }
  .navitem.active{ color: var(--primary); }
  .navitem.active svg{ transform: translateY(-2px); }

  .balance-card{
    border-radius:22px; padding:26px 22px; position:relative; overflow:hidden;
    background: linear-gradient(135deg, #114A3D 0%, #0B2F28 100%);
    border:1px solid rgba(25,227,166,0.25);
  }
  .balance-card::before{
    content:''; position:absolute; width:180px; height:180px; border-radius:50%;
    background: var(--primary); opacity:0.18; filter:blur(50px); top:-60px; right:-40px;
  }
  .balance-amount{ font-family: var(--font-mono); font-size:38px; font-weight:600; letter-spacing:-0.01em; }

  .package-card{
    background: linear-gradient(145deg, #113D34 0%, #092621 100%);
    border: 1px solid rgba(232,196,104,0.3);
    border-radius: 20px; padding: 22px; margin-bottom: 16px; position: relative; overflow: hidden;
  }
  .package-features{
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 16px 0; font-size: 13px; color: var(--text-muted);
  }
  .package-features b{ color: var(--text); font-family: var(--font-mono); }

  .task-card{
    display:flex; align-items:center; gap:14px; padding:16px; border-radius:16px; background:var(--surface);
    border:1px solid var(--line); margin-bottom:12px;
  }
  .task-icon{
    width:44px; height:44px; border-radius:12px; background: var(--primary-soft); color:var(--primary);
    display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:18px;
  }
  .task-reward{ font-family: var(--font-mono); color: var(--primary); font-weight:600; font-size:14px; }
  .pill{ display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:999px; font-size:11px; font-weight:600; }
  .pill-approved{ background: var(--primary-soft); color: var(--primary); }

  .empty{ text-align:center; padding:50px 20px; color:var(--text-faint); }
  .empty svg{ margin-bottom:14px; opacity:0.5; }

  .toast{
    position:fixed; top:18px; left:50%; transform:translateX(-50%); z-index:100;
    background: var(--surface-3); border:1px solid var(--line); color:var(--text);
    padding:13px 20px; border-radius:999px; font-size:14px; font-weight:500;
    box-shadow: var(--shadow-lift); display:flex; align-items:center; gap:8px; max-width:90%;
  }
  .spinner{
    width:18px; height:18px; border-radius:50%; border:2.5px solid rgba(255,255,255,0.25);
    border-top-color: currentColor; animation: spin .7s linear infinite; display:inline-block;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }
  .page-loader{ display:flex; align-items:center; justify-content:center; flex:1; min-height:60vh; color:var(--primary); }
  .section-title{ display:flex; align-items:center; justify-content:space-between; margin: 26px 0 14px; }
  .section-title h3{ font-size:16px; }
</style>
</head>
<body>
<div id="bg-orbs"><div class="orb orb1"></div><div class="orb orb2"></div><div class="orb orb3"></div></div>
<div id="app"></div>
<div id="toast-root"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc, addDoc, collection, query, where, orderBy, onSnapshot, serverTimestamp, increment, runTransaction } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDsgQJgZ64-ARLqKa3vcdQpu_xVupD90W4",
  authDomain: "apexify-72bc2.firebaseapp.com",
  projectId: "apexify-72bc2",
  storageBucket: "apexify-72bc2.firebasestorage.app",
  messagingSenderId: "114061131405",
  appId: "1:114061131405:web:ffd00b701d70c164976cc4"
};

const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const db = getFirestore(fbApp);

let state = {
  route: location.hash.replace('#','') || '/',
  user: null,
  profile: null,
  tasks: [],
  myPackages: [],
  loading: true,
};
let unsubs = [];

function setRoute(r){ location.hash = r; }
window.addEventListener('hashchange', () => { state.route = location.hash.replace('#','') || '/'; render(); });

function toast(msg, type='success'){
  const root = document.getElementById('toast-root');
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `<span>${type==='success' ? '✓' : '!'}</span><span>${msg}</span>`;
  root.appendChild(el);
  setTimeout(() => el.remove(), 2800);
}

const ic = {
  home: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg>`,
  task: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 10h8M8 14h5"/></svg>`,
  package: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2l9 4.5v11L12 22l-9-4.5v-11L12 2z"/><path d="M12 22v-11.5M3.5 6.5l8.5 5 8.5-5"/></svg>`,
  wallet: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 10h18"/><circle cx="16.5" cy="14" r="1.1" fill="currentColor" stroke="none"/></svg>`,
  profile: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3.4"/><path d="M5 20c1.2-4 4.2-6 7-6s5.8 2 7 6"/></svg>`,
};

function clearSubs(){ unsubs.forEach(u=>u()); unsubs=[]; }

function attachUserListeners(uid){
  clearSubs();
  unsubs.push(onSnapshot(doc(db,'users',uid), (snap) => {
    state.profile = snap.exists() ? snap.data() : null;
    render();
  }));
  unsubs.push(onSnapshot(query(collection(db,'users',uid,'myPackages')), (snap) => {
    state.myPackages = snap.docs.map(d => ({id: d.id, ...d.data()}));
    render();
  }));
  unsubs.push(onSnapshot(collection(db,'tasks'), (snap) => {
    state.tasks = snap.docs.map(d => ({id: d.id, ...d.data()}));
    render();
  }));
}

onAuthStateChanged(auth, async (user) => {
  state.user = user;
  if(user){
    attachUserListeners(user.uid);
  } else {
    clearSubs();
    state.profile = null;
    state.myPackages = [];
  }
  state.loading = false;
  render();
});

window.buyPackage = async function(pkgName, price, dailyReturn, durationDays) {
  if(!state.user) return setRoute('/login');
  if((state.profile?.balance || 0) < price) {
    return toast('পর্যাপ্ত ব্যালেন্স নেই! ডিপোজিট করুন।', 'error');
  }

  try {
    await runTransaction(db, async (transaction) => {
      const userRef = doc(db, 'users', state.user.uid);
      const uSnap = await transaction.get(userRef);
      const currentBal = uSnap.data().balance || 0;
      
      if(currentBal < price) throw new Error('অপর্যাপ্ত ব্যালেন্স!');

      transaction.update(userRef, { balance: currentBal - price });

      const newPkgRef = doc(collection(db, 'users', state.user.uid, 'myPackages'));
      transaction.set(newPkgRef, {
        name: pkgName,
        price: price,
        dailyReturn: dailyReturn,
        daysLeft: durationDays,
        totalDays: durationDays,
        lastClaimDate: '',
        createdAt: serverTimestamp()
      });
    });
    toast('সফলভাবে প্যাকেজটি ক্রয় করা হয়েছে!');
  } catch(e) {
    toast(e.message, 'error');
  }
};

window.claimDailyProfit = async function(pkgId, lastClaim, dailyReturn) {
  const today = new Date().toDateString();
  if(lastClaim === today) {
    return toast('আজকের প্রফিট ইতিমধ্যে সংগ্রহ করা হয়েছে!', 'error');
  }

  try {
    await runTransaction(db, async (transaction) => {
      const userRef = doc(db, 'users', state.user.uid);
      const pkgRef = doc(db, 'users', state.user.uid, 'myPackages', pkgId);
      
      const uSnap = await transaction.get(userRef);
      const pSnap = await transaction.get(pkgRef);

      if(!pSnap.exists()) throw new Error('প্যাকেজটি পাওয়া যায়নি!');
      const pData = pSnap.data();
      if(pData.daysLeft <= 0) throw new Error('প্যাকেজের মেয়াদ শেষ!');

      const currentBal = uSnap.data().balance || 0;

      transaction.update(userRef, { balance: currentBal + dailyReturn });
      transaction.update(pkgRef, {
        daysLeft: pData.daysLeft - 1,
        lastClaimDate: today
      });
    });
    toast(`সফলভাবে ${dailyReturn} টাকা ব্যালেন্সে যোগ হলো!`);
  } catch(e) {
    toast(e.message, 'error');
  }
};

function renderBottomNav(){
  if(!state.user || state.route === '/login' || state.route === '/register') return '';
  return `
    <nav class="bottomnav">
      <button class="navitem ${state.route==='/'?'active':''}" onclick="location.hash='/'">${ic.home}হোম</button>
      <button class="navitem ${state.route==='/packages'?'active':''}" onclick="location.hash='/packages'">${ic.package}ভিআইপি প্ল্যান</button>
      <button class="navitem ${state.route==='/tasks'?'active':''}" onclick="location.hash='/tasks'">${ic.task}টাস্ক</button>
      <button class="navitem ${state.route==='/wallet'?'active':''}" onclick="location.hash='/wallet'">${ic.wallet}ওয়ালেট</button>
      <button class="navitem ${state.route==='/profile'?'active':''}" onclick="location.hash='/profile'">${ic.profile}প্রোফাইল</button>
    </nav>
  `;
}

function render(){
  const app = document.getElementById('app');
  if(state.loading){
    app.innerHTML = `<div class="page-loader"><span class="spinner"></span></div>`;
    return;
  }

  let html = '';
  const r = state.route;

  if(!state.user && r !== '/login' && r !== '/register'){
    setRoute('/login');
    return;
  }

  if(r === '/login'){
    html = `
      <div class="screen" style="justify-content:center;">
        <div style="text-align:center; margin-bottom:30px;">
          <div style="font-size:24px; font-weight:700; margin-bottom:10px;">Apexify</div>
          <p style="color:var(--text-muted); font-size:14px;">আপনার অ্যাকাউন্টে লগইন করুন</p>
        </div>
        <div class="card card-glow">
          <form id="login-form">
            <div class="field"><label>ইমেইল</label><input type="email" id="l-email" required placeholder="name@example.com"></div>
            <div class="field"><label>পাসওয়ার্ড</label><input type="password" id="l-pass" required placeholder="••••••••"></div>
            <button type="submit" class="btn btn-primary btn-block" style="margin-top:10px;">লগইন করুন</button>
          </form>
          <div style="text-align:center; margin-top:20px; font-size:13.5px; color:var(--text-muted);">
            অ্যাকাউন্ট নেই? <a href="#/register" style="color:var(--primary); font-weight:600;">রেজিস্ট্রেশন করুন</a>
          </div>
        </div>
      </div>
    `;
  } else if(r === '/register'){
    html = `
      <div class="screen" style="justify-content:center;">
        <div style="text-align:center; margin-bottom:24px;">
          <div style="font-size:24px; font-weight:700; margin-bottom:10px;">Apexify</div>
          <p style="color:var(--text-muted); font-size:14px;">নতুন অ্যাকাউন্ট তৈরি করুন</p>
        </div>
        <div class="card card-glow">
          <form id="reg-form">
            <div class="field"><label>আপনার নাম</label><input type="text" id="r-name" required placeholder="পূর্ণ নাম"></div>
            <div class="field"><label>ইমেইল</label><input type="email" id="r-email" required placeholder="name@example.com"></div>
            <div class="field"><label>পাসওয়ার্ড</label><input type="password" id="r-pass" required placeholder="কমপক্ষে ৬ ডিজিট"></div>
            <button type="submit" class="btn btn-primary btn-block" style="margin-top:10px;">অ্যাকাউন্ট খুলুন</button>
          </form>
          <div style="text-align:center; margin-top:20px; font-size:13.5px; color:var(--text-muted);">
            ইতিমধ্যে অ্যাকাউন্ট আছে? <a href="#/login" style="color:var(--primary); font-weight:600;">লগইন করুন</a>
          </div>
        </div>
      </div>
    `;
  } else if(r === '/packages'){
    const bal = state.profile?.balance || 0;
    html = `
      <div class="screen">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
          <h2>ভিআইপি প্যাকেজসমূহ</h2>
          <div class="mono" style="color:var(--primary); font-weight:600;">ব্যালেন্স: ৳${bal}</div>
        </div>

        <div class="package-card">
          <span class="eyebrow" style="color:var(--gold);">প্রিমিয়াম ইনভেস্টমেন্ট</span>
          <h3 style="font-size:20px; margin:6px 0;">গোল্ডেন ভিআইপি প্ল্যান</h3>
          <p style="font-size:13px; color:var(--text-muted);">প্যাকেজ কিনে প্রতিদিন নিশ্চিত রিটার্ন নিন!</p>
          
          <div class="package-features">
            <div>মূল্য: <b>৳১,০০০</b></div>
            <div>দৈনিক আয়: <b style="color:var(--primary);">৳৭৫০</b></div>
            <div>মেয়াদ: <b>১৫ দিন</b></div>
            <div>মোট রিটার্ন: <b style="color:var(--gold);">৳১১,২৫০</b></div>
          </div>
          <button class="btn btn-primary btn-block" onclick="buyPackage('Golden VIP Plan', 1000, 750, 15)">প্যাকেজটি কিনুন (৳১০০০)</button>
        </div>

        <div class="section-title"><h3>আমার সক্রিয় প্যাকেজসমূহ</h3></div>
        ${state.myPackages.length === 0 ? `
          <div class="empty">${ic.empty}<div>কোনো সক্রিয় প্যাকেজ নেই</div></div>
        ` : state.myPackages.map(p => {
          const today = new Date().toDateString();
          const isCollected = p.lastClaimDate === today;
          return `
            <div class="card" style="margin-bottom:12px;">
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                <h4 style="font-size:16px;">${p.name}</h4>
                <span class="pill pill-approved">বাকি: ${p.daysLeft} দিন</span>
              </div>
              <p style="font-size:12.5px; color:var(--text-muted); margin-bottom:12px;">দৈনিক প্রফিট: ৳${p.dailyReturn}</p>
              <button class="btn ${isCollected ? 'btn-ghost' : 'btn-primary'} btn-sm btn-block"

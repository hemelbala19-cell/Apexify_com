<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Apexify</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family: 'Inter', sans-serif;
    background: #08211D;
    color: #EAF7F1;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .container{
    width: 100%;
    max-width: 400px;
    padding: 24px;
    background: #0F332C;
    border: 1px solid rgba(163, 224, 202, 0.15);
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  }
  h2{ text-align: center; margin-bottom: 20px; color: #19E3A6; }
  .field{ margin-bottom: 15px; }
  .field label{ display: block; font-size: 13px; margin-bottom: 6px; color: #8FB6A9; }
  .field input{
    width: 100%; padding: 12px; background: #154339; border: 1px solid rgba(163, 224, 202, 0.2);
    border-radius: 8px; color: #fff; font-size: 14px; outline: none;
  }
  .field input:focus{ border-color: #19E3A6; }
  .btn{
    width: 100%; padding: 12px; background: #19E3A6; color: #04140F; border: none;
    border-radius: 8px; font-weight: 600; font-size: 15px; cursor: pointer; margin-top: 10px;
  }
  .btn:active{ opacity: 0.9; }
  .error-box{
    background: rgba(255,122,122,0.15); color: #FF7A7A; padding: 10px; border-radius: 8px;
    font-size: 13px; margin-bottom: 15px; display: none; text-align: center;
  }
</style>
</head>
<body>

<div class="container">
  <h2>Apexify</h2>
  <div id="error-msg" class="error-box"></div>
  
  <div id="auth-view">
    <div class="field">
      <label>ইমেইল</label>
      <input type="email" id="email" placeholder="name@example.com">
    </div>
    <div class="field">
      <label>পাসওয়ার্ড</label>
      <input type="password" id="password" placeholder="••••••••">
    </div>
    <button class="btn" id="login-btn">লগইন করুন</button>
  </div>

  <div id="dashboard-view" style="display: none;">
    <p style="text-align: center; margin-bottom: 15px;">স্বাগতম, আপনার ড্যাশবোর্ডে!</p>
    <div style="background: #154339; padding: 15px; border-radius: 10px; text-align: center; margin-bottom: 15px;">
      <div style="font-size: 13px; color: #8FB6A9;">মূল ব্যালেন্স</div>
      <div style="font-size: 24px; font-weight: bold; color: #19E3A6;" id="user-bal">৳0</div>
    </div>
    <button class="btn" id="logout-btn" style="background: #FF7A7A; color: #fff;">লগআউট</button>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDsgQJgZ64-ARLqKa3vcdQpu_xVupD90W4",
    authDomain: "apexify-72bc2.firebaseapp.com",
    projectId: "apexify-72bc2",
    storageBucket: "apexify-72bc2.firebasestorage.app",
    messagingSenderId: "114061131405",
    appId: "1:114061131405:web:ffd00b701d70c164976cc4"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const authView = document.getElementById('auth-view');
  const dashView = document.getElementById('dashboard-view');
  const errorBox = document.getElementById('error-msg');

  function showError(msg){
    errorBox.style.display = 'block';
    errorBox.innerText = msg;
  }

  document.getElementById('login-btn').addEventListener('click', async () => {
    errorBox.style.display = 'none';
    const email = document.getElementById('email').value.trim();
    const pass = document.getElementById('password').value.trim();
    
    if(!email || !pass){
      showError('দمه করে ইমেইল ও পাসওয়ার্ড দিন');
      return;
    }

    try {
      await signInWithEmailAndPassword(auth, email, pass);
    } catch(err) {
      showError(err.message);
    }
  });

  document.getElementById('logout-btn').addEventListener('click', () => {
    signOut(auth);
  });

  onAuthStateChanged(auth, async (user) => {
    if(user){
      authView.style.display = 'none';
      dashView.style.display = 'block';
      
      try {
        const userDoc = await getDoc(doc(db, 'users', user.uid));
        if(userDoc.exists()){
          document.getElementById('user-bal').innerText = `৳${userDoc.data().balance || 0}`;
        }
      } catch(e) {
        console.error(e);
      }
    } else {
      authView.style.display = 'block';
      dashView.style.display = 'none';
    }
  });
</script>

</body>
</html>

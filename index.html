<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Apexify — User Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5FAF8;
    --card:#FFFFFF;
    --primary:#0EA37A;
    --primary-dark:#0A7C5C;
    --accent:#14C38E;
    --accent-soft:#E4F7F0;
    --dark-card-1:#0E241D;
    --dark-card-2:#123A2C;
    --text:#12211C;
    --text-mute:#72847E;
    --border:#E9F1EE;
    --danger:#E5484D;
    --danger-soft:#FDECEC;
    --warning:#B9791F;
    --warning-soft:#FBF0DE;
    --ok-soft:#E3F7EE;
    --radius-lg:22px;
    --radius-md:16px;
    --radius-pill:999px;
    --shadow:0 10px 26px rgba(14,40,31,0.09);
    --shadow-sm:0 4px 12px rgba(14,40,31,0.06);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; background:#DDEDE7; font-family:'Inter',sans-serif; color:var(--text);
    display:flex; justify-content:center;
  }
  h1,h2,h3,.display{font-family:'Manrope',sans-serif;}
  #phone{
    width:100%; max-width:430px; min-height:100vh; background:var(--bg);
    position:relative; overflow-x:hidden; display:flex; flex-direction:column;
  }
  ::-webkit-scrollbar{display:none;}
  button{font-family:inherit; cursor:pointer;}
  input{font-family:inherit;}
  .hidden{display:none !important;}

  /* ---------- Buttons ---------- */
  .btn{
    border:none; border-radius:var(--radius-pill); padding:15px 20px; font-weight:700;
    font-size:15px; display:flex; align-items:center; justify-content:center; gap:8px;
    transition:transform .18s cubic-bezier(.34,1.56,.64,1), opacity .15s ease, box-shadow .2s ease, filter .15s ease;
    position:relative; overflow:hidden;
  }
  .btn:active{transform:scale(0.95);}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--primary-dark)); color:#fff; box-shadow:0 8px 18px rgba(14,163,122,.28); isolation:isolate;}
  .btn-primary::before{
    content:''; position:absolute; inset:0; z-index:-1;
    background:linear-gradient(120deg, transparent 30%, rgba(255,255,255,.35) 45%, transparent 60%);
    transform:translateX(-120%); transition:transform .6s ease;
  }
  .btn-primary:hover::before{transform:translateX(120%);}
  .btn-primary:hover{filter:brightness(1.06); box-shadow:0 10px 22px rgba(14,163,122,.36); transform:translateY(-1px);}
  .btn-primary:active{box-shadow:0 4px 10px rgba(14,163,122,.35); transform:scale(0.95) translateY(0);}
  .btn-outline{background:#fff; color:var(--primary-dark); border:1.5px solid var(--border); transition:all .18s ease;}
  .btn-outline:hover{border-color:var(--accent); background:var(--accent-soft);}
  .btn-block{width:100%;}
  .btn-sm{padding:9px 16px; font-size:13px;}
  .btn:disabled{opacity:.7; pointer-events:none;}
  .btn-spin{
    width:18px; height:18px; border-radius:50%;
    border:2.5px solid rgba(255,255,255,.4); border-top-color:#fff;
    animation:btnspin .7s linear infinite; flex-shrink:0;
  }
  .btn-outline .btn-spin, .btn-ghost .btn-spin{
    border:2.5px solid rgba(0,0,0,.15); border-top-color:var(--primary-dark);
  }
  @keyframes btnspin{to{transform:rotate(360deg);}}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ---------- Auth ---------- */
  #auth-screen{flex:1; display:flex; flex-direction:column; padding:34px 24px 24px;}
  .auth-logo{display:flex; align-items:center; gap:10px; margin-bottom:36px;}
  .auth-logo .mark{width:42px; height:42px; border-radius:13px; background:linear-gradient(135deg,var(--accent),var(--primary-dark)); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; font-family:'Manrope';}
  .auth-logo .name{font-weight:800; font-size:19px;}
  .auth-title{font-size:26px; font-weight:800; margin:0 0 6px;}
  .auth-sub{color:var(--text-mute); font-size:14.5px; margin:0 0 28px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12.5px; font-weight:700; color:var(--text-mute); margin-bottom:7px; letter-spacing:.2px;}
  .field-input{
    display:flex; align-items:center; gap:10px; background:#fff; border:1.5px solid var(--border);
    border-radius:14px; padding:13px 15px;
  }
  .field-input:focus-within{border-color:var(--primary);}
  .field-input input{border:none; outline:none; flex:1; font-size:15px; background:transparent; color:var(--text);}
  .field-input svg{flex-shrink:0;}
  .eye-toggle{background:none; border:none; padding:2px; display:flex; color:var(--text-mute);}
  .row-between{display:flex; align-items:center; justify-content:space-between; margin:4px 0 22px;}
  .remember{display:flex; align-items:center; gap:8px; font-size:13.5px; color:var(--text-mute);}
  .link{color:var(--primary-dark); font-weight:700; font-size:13.5px; text-decoration:none;}
  .divider{display:flex; align-items:center; gap:10px; color:var(--text-mute); font-size:12.5px; margin:22px 0;}
  .divider::before,.divider::after{content:''; flex:1; height:1px; background:var(--border);}
  .social-row{display:flex; gap:10px;}
  .social-btn{flex:1; background:#fff; border:1.5px solid var(--border); border-radius:14px; padding:12px; display:flex; align-items:center; justify-content:center; gap:8px; font-weight:600; font-size:13.5px; transition:transform .15s cubic-bezier(.34,1.56,.64,1), border-color .15s ease;}
  .social-btn:active{transform:scale(0.95);}
  .social-btn:hover{border-color:var(--accent);}
  .auth-switch{text-align:center; margin-top:24px; font-size:14px; color:var(--text-mute);}
  .err-msg{color:var(--danger); font-size:12.5px; font-weight:600; margin-top:6px; min-height:16px;}

  /* ---------- App shell ---------- */
  #app-shell{flex:1; display:flex; flex-direction:column;}
  header.topbar{
    position:sticky; top:0; z-index:20; background:var(--bg); padding:16px 18px 10px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .brand{display:flex; align-items:center; gap:9px;}
  .brand .mark{width:34px; height:34px; border-radius:10px; background:linear-gradient(135deg,var(--accent),var(--primary-dark)); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; font-size:14px; font-family:'Manrope';}
  .brand .name{font-weight:800; font-size:16px;}
  .top-actions{display:flex; align-items:center; gap:10px;}
  .icon-btn{
    width:38px; height:38px; border-radius:12px; background:#fff; border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center; position:relative; color:var(--text);
    transition:transform .15s cubic-bezier(.34,1.56,.64,1), box-shadow .15s ease, border-color .15s ease;
  }
  .icon-btn:active{transform:scale(0.88); box-shadow:0 2px 6px rgba(0,0,0,.12);}
  .icon-btn:hover{border-color:var(--accent);}
  .badge-dot{position:absolute; top:6px; right:7px; width:8px; height:8px; border-radius:50%; background:var(--danger); border:2px solid var(--bg);}

  main{flex:1; padding:4px 18px 100px; overflow-y:auto;}
  .screen-title{font-size:20px; font-weight:800; margin:6px 0 16px;}
  .back-row{display:flex; align-items:center; gap:10px; margin:6px 0 16px;}
  .back-btn{width:34px; height:34px; border-radius:11px; background:#fff; border:1px solid var(--border); display:flex; align-items:center; justify-content:center;}

  /* ---------- Bottom nav ---------- */
  nav.bottomnav{
    position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:430px;
    background:#fff; border-top:1px solid var(--border); display:flex; align-items:center; justify-content:space-around;
    padding:10px 6px calc(10px + env(safe-area-inset-bottom)); z-index:30;
  }
  .nav-item{
    background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:4px;
    color:var(--text-mute); font-size:10.5px; font-weight:700; flex:1; padding:4px 0;
    transition:transform .15s cubic-bezier(.34,1.56,.64,1), color .15s ease;
  }
  .nav-item:active{transform:scale(0.88);}
  .nav-item.active{color:var(--primary-dark);}
  .nav-fab{
    width:54px; height:54px; border-radius:50%; background:linear-gradient(135deg,var(--accent),var(--primary-dark));
    display:flex; align-items:center; justify-content:center; color:#fff; margin-top:-28px;
    transition:transform .18s cubic-bezier(.34,1.56,.64,1), box-shadow .18s ease;
    box-shadow:0 10px 20px rgba(14,163,122,.4); border:4px solid var(--bg); flex-shrink:0;
  }
  .nav-fab:active{transform:scale(0.9); box-shadow:0 6px 14px rgba(14,163,122,.45);}

  /* ---------- Cards / dashboard ---------- */
  .banner{
    border-radius:var(--radius-lg); background:linear-gradient(120deg,#0F2E24,#14523D 60%,#0EA37A);
    color:#fff; padding:20px; margin-bottom:14px; position:relative; overflow:hidden;
  }
  .banner h3{margin:0 0 4px; font-size:16.5px;}
  .banner p{margin:0; font-size:12.5px; opacity:.85; max-width:75%;}
  .banner .glow{position:absolute; right:-30px; top:-30px; width:120px; height:120px; border-radius:50%; background:rgba(255,255,255,.12);}

  .action-card{
    display:flex; align-items:center; gap:12px; background:var(--warning-soft); border:1px solid #F0DFB8;
    border-radius:var(--radius-md); padding:13px 14px; margin-bottom:14px;
  }
  .action-card .txt{flex:1;}
  .action-card .txt b{display:block; font-size:13.5px; margin-bottom:2px;}
  .action-card .txt span{font-size:12px; color:var(--text-mute);}

  .status-strip{display:flex; align-items:center; gap:8px; background:#fff; border:1px solid var(--border); border-radius:14px; padding:11px 14px; margin-bottom:14px;}
  .status-dot{width:9px; height:9px; border-radius:50%; background:var(--primary);}
  .status-strip.inactive .status-dot{background:var(--danger);}
  .status-strip .stxt{flex:1; font-size:13.5px; font-weight:600;}
  .chip{font-size:11px; font-weight:800; padding:4px 10px; border-radius:var(--radius-pill);}
  .chip.ok{background:var(--ok-soft); color:var(--primary-dark);}
  .chip.warn{background:var(--warning-soft); color:var(--warning);}
  .chip.bad{background:var(--danger-soft); color:var(--danger);}

  .asset-card{
    border-radius:var(--radius-lg); background:linear-gradient(155deg,var(--dark-card-2),var(--dark-card-1));
    color:#fff; padding:22px 20px; margin-bottom:14px; position:relative; overflow:hidden;
  }
  .asset-card .lbl{font-size:12px; color:#9FC4B6; display:flex; align-items:center; justify-content:space-between;}
  .asset-card .val{font-size:30px; font-weight:800; font-family:'Manrope'; margin:8px 0 16px;}
  .asset-card .sub-balances{display:flex; gap:10px;}
  .mini-bal{flex:1; background:rgba(255,255,255,.08); border-radius:13px; padding:10px 12px;}
  .mini-bal span{display:block; font-size:10.5px; color:#9FC4B6; margin-bottom:4px;}
  .mini-bal b{font-size:14px; font-family:'Manrope';}
  .currency-pill{background:rgba(255,255,255,.14); border:none; color:#fff; font-size:11px; font-weight:700; padding:4px 9px; border-radius:var(--radius-pill); display:flex; align-items:center; gap:4px;}

  .grid-2{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:14px;}
  .stat-card{background:#fff; border:1px solid var(--border); border-radius:16px; padding:14px;}
  .stat-card span{font-size:11.5px; color:var(--text-mute); font-weight:600;}
  .stat-card b{display:block; font-size:18px; margin-top:4px; font-family:'Manrope';}
  .stat-card b.up{color:var(--primary-dark);}

  .section-head{display:flex; align-items:center; justify-content:space-between; margin:18px 0 10px;}
  .section-head h3{font-size:15px; margin:0;}
  .section-head .see-all{font-size:12.5px; font-weight:700; color:var(--primary-dark); background:none; border:none;}

  .services-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:6px;}
  .svc-item{display:flex; flex-direction:column; align-items:center; gap:7px; background:#fff; border:1px solid var(--border); border-radius:16px; padding:12px 4px; text-align:center; transition:transform .15s cubic-bezier(.34,1.56,.64,1), box-shadow .15s ease, border-color .15s ease;}
  .svc-item:active{transform:scale(0.93); box-shadow:0 4px 10px rgba(0,0,0,.08);}
  .svc-item:hover{border-color:var(--accent);}
  .svc-item .ic{width:38px; height:38px; border-radius:12px; background:var(--accent-soft); color:var(--primary-dark); display:flex; align-items:center; justify-content:center;}
  .svc-item span{font-size:10.5px; font-weight:700; line-height:1.2;}

  .earn-item{display:flex; align-items:center; gap:12px; background:#fff; border:1px solid var(--border); border-radius:15px; padding:12px 13px; margin-bottom:9px;}
  .earn-item .ic{width:38px; height:38px; border-radius:12px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .earn-item .ic.plus{background:var(--ok-soft); color:var(--primary-dark);}
  .earn-item .ic.minus{background:var(--danger-soft); color:var(--danger);}
  .earn-item .body{flex:1; min-width:0;}
  .earn-item .body b{display:block; font-size:13.5px;}
  .earn-item .body span{font-size:11.5px; color:var(--text-mute);}
  .earn-item .amt{font-size:14px; font-weight:800; font-family:'Manrope';}
  .amt.plus{color:var(--primary-dark);} .amt.minus{color:var(--danger);}

  .ranker-row{display:flex; align-items:center; gap:11px; background:#fff; border:1px solid var(--border); border-radius:15px; padding:11px 13px; margin-bottom:9px;}
  .rank-no{width:26px; height:26px; border-radius:50%; background:var(--accent-soft); color:var(--primary-dark); font-weight:800; font-size:12px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .rank-no.gold{background:#FCEBBF; color:#9A6B00;}
  .avatar{width:34px; height:34px; border-radius:50%; background:linear-gradient(135deg,var(--accent),var(--primary-dark)); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; flex-shrink:0;}
  .ranker-row .body{flex:1;}
  .ranker-row .body b{display:block; font-size:13.5px;}
  .ranker-row .body span{font-size:11.5px; color:var(--text-mute);}

  .partners-row{display:flex; gap:10px; overflow-x:auto; padding-bottom:4px;}
  .partner-chip{flex-shrink:0; background:#fff; border:1px solid var(--border); border-radius:14px; padding:10px 16px; font-weight:800; font-size:13px; color:var(--text);}

  /* ---------- Generic list / detail card ---------- */
  .card{background:#fff; border:1px solid var(--border); border-radius:var(--radius-md); padding:16px; margin-bottom:14px;}
  .kv-row{display:flex; align-items:center; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--border); font-size:13.5px;}
  .kv-row:last-child{border-bottom:none;}
  .kv-row span{color:var(--text-mute);}
  .kv-row b{font-weight:700;}

  .tabbar{display:flex; background:#fff; border:1px solid var(--border); border-radius:var(--radius-pill); padding:4px; margin-bottom:16px;}
  .tabbar button{flex:1; border:none; background:none; padding:9px 6px; border-radius:var(--radius-pill); font-weight:700; font-size:12.5px; color:var(--text-mute); transition:transform .15s cubic-bezier(.34,1.56,.64,1), background .2s ease, color .2s ease;}
  .tabbar button:active{transform:scale(0.93);}
  .tabbar button.active{background:linear-gradient(135deg,var(--accent),var(--primary-dark)); color:#fff;}

  .empty-state{display:flex; flex-direction:column; align-items:center; text-align:center; padding:50px 20px; color:var(--text-mute);}
  .empty-state .ic{width:56px; height:56px; border-radius:50%; background:var(--accent-soft); color:var(--primary-dark); display:flex; align-items:center; justify-content:center; margin-bottom:14px;}
  .empty-state b{color:var(--text); font-size:14.5px; display:block; margin-bottom:4px;}
  .empty-state span{font-size:12.5px;}

  .wallet-item{display:flex; align-items:center; gap:12px; background:#fff; border:1px solid var(--border); border-radius:15px; padding:13px; margin-bottom:10px;}
  .wallet-item .ic{width:42px; height:42px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-weight:800; color:#fff; font-size:12px; flex-shrink:0;}
  .wallet-item .body{flex:1;}
  .wallet-item .body b{display:block; font-size:14px;}
  .wallet-item .body span{font-size:11.5px; color:var(--text-mute);}
  .wallet-item .del{background:none; border:none; color:var(--danger); padding:6px;}

  .progress-wrap{background:#EFF6F3; border-radius:var(--radius-pill); height:10px; overflow:hidden; margin:10px 0;}
  .progress-bar{height:100%; border-radius:var(--radius-pill); background:linear-gradient(90deg,var(--accent),var(--primary-dark));}

  .modal-overlay{position:fixed; inset:0; background:rgba(10,25,20,.45); z-index:50; display:flex; align-items:flex-end; justify-content:center;}
  .modal-overlay.center{align-items:center; padding:20px;}
  .sheet{
    width:100%; max-width:430px; background:var(--bg); border-radius:24px 24px 0 0; padding:20px 20px calc(20px + env(safe-area-inset-bottom));
    max-height:82vh; overflow-y:auto;
  }
  .sheet.card-modal{border-radius:22px; max-width:360px; padding:22px;}
  .sheet-handle{width:38px; height:4px; background:var(--border); border-radius:99px; margin:0 auto 16px;}
  .sheet h3{margin:0 0 4px; font-size:17px;}
  .sheet p.desc{color:var(--text-mute); font-size:13px; margin:0 0 18px;}

  .toast{
    position:fixed; bottom:96px; left:50%; transform:translateX(-50%); background:var(--dark-card-1); color:#fff;
    padding:12px 18px; border-radius:var(--radius-pill); font-size:13px; font-weight:600; z-index:60;
    display:flex; align-items:center; gap:8px; box-shadow:var(--shadow); max-width:88%;
  }

  .code-input{
    width:100%; text-align:center; letter-spacing:4px; font-weight:800; font-size:18px; padding:16px; border-radius:14px;
    border:1.5px dashed var(--primary); background:var(--accent-soft); color:var(--primary-dark); outline:none;
  }

  .profile-head{display:flex; flex-direction:column; align-items:center; padding:14px 0 20px;}
  .profile-avatar{width:78px; height:78px; border-radius:50%; background:linear-gradient(135deg,var(--accent),var(--primary-dark)); color:#fff; font-size:28px; font-weight:800; display:flex; align-items:center; justify-content:center; margin-bottom:10px; font-family:'Manrope';}
  .profile-head b{font-size:17px;}
  .profile-head span{font-size:12.5px; color:var(--text-mute);}
  .menu-row{display:flex; align-items:center; gap:12px; background:#fff; border:1px solid var(--border); border-radius:15px; padding:13px; margin-bottom:10px; transition:transform .12s ease, box-shadow .15s ease, border-color .15s ease; cursor:pointer;}
  .menu-row:active{transform:scale(0.98); box-shadow:0 3px 8px rgba(0,0,0,.06);}
  .menu-row:hover{border-color:var(--accent);}
  .menu-row .ic{width:36px; height:36px; border-radius:11px; background:var(--accent-soft); color:var(--primary-dark); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .menu-row span{flex:1; font-weight:600; font-size:13.5px;}
  .menu-row.danger .ic{background:var(--danger-soft); color:var(--danger);}
  .menu-row.danger span{color:var(--danger);}

  .skeleton{background:linear-gradient(90deg,#EAF3EF 25%,#F4FAF8 37%,#EAF3EF 63%); background-size:400% 100%; animation:sk 1.4s ease infinite; border-radius:14px;}
  @keyframes sk{0%{background-position:100% 50%} 100%{background-position:0 50%}}

  /* ---------- Account activation ---------- */
  .activation-card{
    border-radius:var(--radius-lg); background:linear-gradient(155deg,#FFF7E8,#FFFFFF 55%); border:1px solid #F0DFB8;
    padding:18px; margin-bottom:14px;
  }
  .activation-card-top{display:flex; align-items:center; gap:12px; margin-bottom:14px;}
  .activation-ic{width:44px; height:44px; border-radius:13px; background:var(--warning-soft); color:var(--warning); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .activation-card-top b{display:block; font-size:14.5px; margin-bottom:2px;}
  .activation-card-top span{font-size:12px; color:var(--text-mute);}

  .svc-item{position:relative;}
  .lock-badge{position:absolute; top:6px; right:6px; width:18px; height:18px; border-radius:50%; background:#fff; border:1px solid var(--border); display:flex; align-items:center; justify-content:center; color:var(--text-mute); box-shadow:var(--shadow-sm);}

  .plan-list{display:flex; flex-direction:column; gap:10px;}
  .plan-item{display:flex; align-items:center; gap:12px; border:1.5px solid var(--border); border-radius:14px; padding:13px 14px; cursor:pointer; background:#fff;}
  .plan-item input{accent-color:#0EA37A; width:18px; height:18px; flex-shrink:0;}
  .plan-item:has(input:checked){border-color:var(--primary); background:var(--accent-soft);}
  .plan-body b{display:block; font-size:13.5px;}
  .plan-body span{font-size:11.5px; color:var(--text-mute);}
  .plan-note{font-size:11px; color:var(--text-mute); text-align:center; margin-top:10px; line-height:1.5;}

  .activation-box{
    background:#fff; border-radius:24px; padding:36px 26px; display:flex; flex-direction:column; align-items:center;

// Subscription plans that unlock the account (Task / Refer / Wallet / Withdraw / Salary).

// (bKash/Nagad Merchant API, SSLCommerz, etc.) on the backend before going live —

let currentView = 'home';
let selectedPlan = 'monthly';
let selectedDepositMethod = 'bKash';

/* ============================================================
   FIREBASE DATA LAYER
   - Firebase Auth stores the password securely.
   - Firestore stores the user's profile, balances, referral data,
     activation status and transaction history.
   - New accounts start with every balance at 0.
   ============================================================ */

const DEFAULT_SETTINGS = {
  activationFee: 10,
  referralCommission: 15,
  dailyFreeIncome: 30,
  minDeposit: 50,
  maxDeposit: 50000,
  minWithdraw: 100,
  maxWithdraw: 20000,
  salaryTarget: 50,
  salaryMonthly: 3000,
  supportLink: ''
};

let firebaseSettings = {...DEFAULT_SETTINGS};
let firebaseUnsubUser = null;

function normalizePhone(phone){
  return phone.replace(/\s|-/g,'');
}

function phoneAuthEmail(phone){
  // The phone number is used only as the user's login identifier.
  // The actual password is handled by Firebase Authentication.
  return `${normalizePhone(phone)}@login.apexify.local`;
}

function makeReferralCode(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let code = 'PB-';
  for(let i=0;i<6;i++) code += chars[Math.floor(Math.random()*chars.length)];
  return code;
}

function getReferralFromUrl(){
  try{
    const p = new URLSearchParams(location.search);
    return (p.get('ref') || '').trim().toUpperCase();
  }catch(e){ return ''; }
}

async function loadFirebaseSettings(){
  const fb = window.apexifyFirebase;
  if(!fb) return;
  try{
    const snap = await fb.getDoc(fb.doc(fb.db,'settings','config'));
    if(snap.exists()){
      firebaseSettings = {...DEFAULT_SETTINGS, ...(snap.data() || {})};
    }
  }catch(e){
    console.warn('Settings read failed; using defaults.', e);
    firebaseSettings = {...DEFAULT_SETTINGS};
  }
}

function applyFirebaseUserData(data){
  const d = data || {};
  state.user = {
    ...state.user,
    ...d,
    name: d.name || state.user.name || 'User',
    phone: d.phone || state.user.phone || '',
    userId: d.userId || state.user.userId || d.uid || '',
    referralId: d.referralId || state.user.referralId || '',
    status: d.status || 'inactive',
    avatarInitial: (d.name || state.user.name || 'U')[0],
    totalRevenue: Number(d.totalRevenue || 0),
    mainBalance: Number(d.mainBalance || 0),
    salaryBalance: Number(d.salaryBalance || 0),
    referralBalance: Number(d.referralBalance || 0),
    depositBalance: Number(d.depositBalance || 0),
    referralCount: Number(d.referralCount || 0),
    completedTaskIds: Array.isArray(d.completedTaskIds) ? d.completedTaskIds : [],
    bkashNumber: d.bkashNumber || null,
    bkashVerified: !!d.bkashVerified,
    nagadNumber: d.nagadNumber || null,
    nagadVerified: !!d.nagadVerified,
    currency: 'BDT'
  };
}

function timeAgo(date){
  const s = Math.floor((Date.now() - date.getTime())/1000);
  if(s < 60) return 'এইমাত্র';
  const m = Math.floor(s/60);
  if(m < 60) return `${m} মিনিট আগে`;
  const h = Math.floor(m/60);
  if(h < 24) return `${h} ঘণ্টা আগে`;
  const dday = Math.floor(h/24);
  if(dday === 1) return 'গতকাল';
  if(dday < 7) return `${dday} দিন আগে`;
  return date.toLocaleDateString('bn-BD');
}

function updateNotifBadge(){
  const badge = document.getElementById('notif-badge');
  if(!badge) return;
  const unread = (state.notifications||[]).some(n=>!n.read);
  badge.classList.toggle('hidden', !unread);
}

async function loadCurrentUser(){
  const fb = window.apexifyFirebase;
  if(!fb || !fb.auth.currentUser) return false;

  await loadFirebaseSettings();
  const uid = fb.auth.currentUser.uid;
  const snap = await fb.getDoc(fb.doc(fb.db,'users',uid));
  if(!snap.exists()){
    toast('অ্যাকাউন্ট ডেটা পাওয়া যায়নি');
    return false;
  }

  applyFirebaseUserData(snap.data());
  await grantDailyFreeIncome();
  await grantInvestmentIncome();
  await processActivationReferralCommission();
  await loadUserCollections();
  return true;
}

// Re-fetches everything (settings, balances, history) and re-renders the
// current screen WITHOUT reloading the browser page — so the session and
// scroll position are never disturbed and there's no risk of a logout.
async function softRefresh(btn){
  const spin = btn?.querySelector('svg');
  if(spin) spin.style.animation = 'spin .6s linear infinite';
  try{
    const ctx = await ensureReady();
    if(!ctx){ toast('ইন্টারনেট সংযোগ চেক করে আবার চেষ্টা করুন'); return; }
    const ok = await loadCurrentUser();
    if(ok){
      go(currentView || 'home');
      toast('রিফ্রেশ হয়েছে');
    }
  }catch(e){
    console.error(e);
    toast('রিফ্রেশ করা যায়নি');
  } finally {
    if(spin) spin.style.animation = '';
  }
}

function openSupport(){
  const link = (firebaseSettings.supportLink || '').trim();
  if(!link){ toast('সাপোর্ট লিংক এখনো সেট করা হয়নি'); return; }
  window.open(link, '_blank');
}

async function loadUserCollections(){
  const fb = window.apexifyFirebase;
  if(!fb || !fb.auth.currentUser) return;
  const uid = fb.auth.currentUser.uid;

  try{
    const rq = await fb.getDocs(
      fb.query(fb.collection(fb.db,'publicProfiles'), fb.where('referrerUid','==',uid))
    );
    state.referrals = rq.docs.map(s => {
      const d=s.data();
      return {
        name:d.name || 'User',
        id:d.userId || s.id,
        date:d.createdAt?.toDate ? d.createdAt.toDate().toLocaleDateString('bn-BD') : '',
        status:d.status || 'inactive'
      };
    });
  }catch(e){ console.warn('Referral list read failed',e); }

  try{
    const tq = await fb.getDocs(
      fb.query(
        fb.collection(fb.db,'transactions'),
        fb.where('uid','==',uid)
      )
    );
    state.earningsHistory = tq.docs.map(s=>{
      const d=s.data();
      const raw = Number(d.amount||0);
      return {
        t:d.title || 'ইনকাম',
        d:d.createdAt?.toDate ? d.createdAt.toLocaleString('bn-BD') : 'এখন',
        amt:Math.abs(raw),
        sign: raw < 0 ? -1 : 1
      };
    }).sort((a,b)=>String(b.d).localeCompare(String(a.d))).slice(0,100);
  }catch(e){ console.warn('Transaction read failed',e); }

  // One-time migration: users who added wallets under the old (editable,
  // multi-slot) system get those numbers copied into the new permanent
  // bkash/nagad fields, if those fields are still empty.
  try{
    if(!state.user.bkashNumber || !state.user.nagadNumber){
      const wq = await fb.getDocs(fb.collection(fb.db,'users',uid,'wallets'));
      const oldWallets = wq.docs.map(s=>s.data());
      const patch = {};
      if(!state.user.bkashNumber){
        const old = oldWallets.find(w=>w.type==='bKash');
        if(old){ patch.bkashNumber = old.number; patch.bkashVerified = !!old.verified; }
      }
      if(!state.user.nagadNumber){
        const old = oldWallets.find(w=>w.type==='Nagad');
        if(old){ patch.nagadNumber = old.number; patch.nagadVerified = !!old.verified; }
      }
      if(Object.keys(patch).length){
        await fb.updateDoc(fb.doc(fb.db,'users',uid), patch);
        Object.assign(state.user, patch);
      }
    }
  }catch(e){ console.warn('Wallet migration failed',e); }

  try{
    const nq = await fb.getDocs(
      fb.query(fb.collection(fb.db,'users',uid,'notifications'), fb.orderBy('createdAt','desc'), fb.limit(50))
    );
    state.notifications = nq.docs.map(s=>{
      const d=s.data();
      return {
        id:s.id, title:d.title||'', body:d.body||'', type:d.type||'general',
        read:!!d.read, time: d.createdAt?.toDate ? timeAgo(d.createdAt.toDate()) : 'এখন'
      };
    });
    updateNotifBadge();
  }catch(e){ console.warn('Notifications read failed',e); }

  try{
    const wdq = await fb.getDocs(fb.query(fb.collection(fb.db,'withdrawalRequests'), fb.where('uid','==',uid)));
    state.withdrawHistory = wdq.docs.map(s=>{
      const d=s.data();
      return {
        amt:Number(d.amount||0),
        wallet:`${d.walletType||''} •• ${(d.walletNumber||'').slice(-4)}`,
        date:d.createdAt?.toDate ? d.createdAt.toDate().toLocaleDateString('bn-BD') : '',
        status:d.status||'pending'
      };
    }).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  }catch(e){ console.warn('Withdraw history read failed',e); }

  try{
    const rdq = await fb.getDocs(fb.query(fb.collection(fb.db,'redemptions'), fb.where('uid','==',uid)));
    state.redeemHistory = rdq.docs.map(s=>{
      const d=s.data();
      return {code:d.code||'', amt:Number(d.amount||0), date:d.createdAt?.toDate ? d.createdAt.toDate().toLocaleDateString('bn-BD') : ''};
    });
  }catch(e){ console.warn('Redeem history read failed',e); }

  try{
    const sq = await fb.getDocs(fb.query(fb.collection(fb.db,'salaryRequests'), fb.where('uid','==',uid)));
    const monthNames = ['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'];
    state.salaryHistory = sq.docs.map(s=>{
      const d=s.data();
      const [y,m]=(d.month||'').split('-');
      return {
        month: d.month||'',
        monthLabel: m ? `${monthNames[Number(m)-1]} ${y}` : (d.month||''),
        status: d.status||'pending'
      };
    }).sort((a,b)=>String(b.month).localeCompare(String(a.month)));
  }catch(e){ console.warn('Salary history read failed',e); }

  try{
    const pq = await fb.getDocs(fb.query(fb.collection(fb.db,'investmentPackages'), fb.where('active','==',true)));
    state.packages = pq.docs.map(s=>({id:s.id, ...s.data()}))
      .sort((a,b)=>Number(a.price||0)-Number(b.price||0));
  }catch(e){ console.warn('Packages read failed',e); }

  try{
    const sub = await fb.getDocs(fb.query(fb.collection(fb.db,'investmentSubscriptions'), fb.where('uid','==',uid)));
    state.mySubscriptions = sub.docs.map(s=>({id:s.id, ...s.data()}))
      .sort((a,b)=>{
        const ta = a.createdAt?.toDate ? a.createdAt.toDate().getTime() : 0;
        const tb = b.createdAt?.toDate ? b.createdAt.toDate().getTime() : 0;
        return tb-ta;
      });
  }catch(e){ console.warn('Subscriptions read failed',e); }

  try{
    const tkq = await fb.getDocs(fb.query(fb.collection(fb.db,'tasks'), fb.where('active','==',true)));
    state.tasks = tkq.docs.map(s=>({id:s.id, ...s.data()}))
      .filter(t => !t.maxWorkers || Number(t.completedCount||0) < Number(t.maxWorkers))
      .sort((a,b)=>{
        const ta = a.createdAt?.toDate ? a.createdAt.toDate().getTime() : 0;
        const tb = b.createdAt?.toDate ? b.createdAt.toDate().getTime() : 0;
        return tb-ta;
      });
  }catch(e){ console.warn('Tasks read failed',e); }

  try{
    const subq = await fb.getDocs(fb.query(fb.collection(fb.db,'taskSubmissions'), fb.where('uid','==',uid)));
    state.mySubmissions = subq.docs.map(s=>{
      const d=s.data();
      return {
        id:s.id, taskId:d.taskId, taskTitle:d.taskTitle||'', reward:Number(d.reward||0),
        status:d.status||'pending',
        date:d.createdAt?.toDate ? d.createdAt.toDate().toLocaleDateString('bn-BD') : ''
      };
    }).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  }catch(e){ console.warn('Task submissions read failed',e); }

  try{
    const lq = await fb.getDocs(fb.query(fb.collection(fb.db,'publicProfiles'), fb.orderBy('referralCount','desc'), fb.limit(10)));
    state.leaderboard = lq.docs.map(s=>{
      const d=s.data();
      const isMe = s.id===uid;
      return {name:(d.name||'User')+(isMe?' (আপনি)':''), count:Number(d.referralCount||0)};
    });
    state.topReferrers = state.leaderboard.slice(0,3).map((r,i)=>({rank:i+1, name:r.name, count:r.count}));
  }catch(e){ console.warn('Leaderboard read failed',e); }
}

async function grantDailyFreeIncome(){
  const fb = window.apexifyFirebase;
  if(!fb || !fb.auth.currentUser) return;

  const uid = fb.auth.currentUser.uid;
  const userRef = fb.doc(fb.db,'users',uid);
  const today = new Date().toISOString().slice(0,10);
  const amount = Number(firebaseSettings.dailyFreeIncome || 30);

  try{
    let added = false;
    await fb.runTransaction(fb.db, async tx=>{
      const snap = await tx.get(userRef);
      if(!snap.exists()) return;
      const d=snap.data();
      if(d.status !== 'active') return;
      if(d.lastDailyCredit === today) return;

      tx.update(userRef,{
        mainBalance: Number(d.mainBalance||0) + amount,
        totalRevenue: Number(d.totalRevenue||0) + amount,
        lastDailyCredit: today,
        updatedAt: fb.serverTimestamp()
      });
      added = true;
    });

    if(added){
      await fb.addDoc(fb.collection(fb.db,'transactions'),{
        uid, type:'daily', title:'দৈনিক ফ্রি ইনকাম',
        amount, createdAt:fb.serverTimestamp()
      });
      const snap=await fb.getDoc(userRef);
      if(snap.exists()) applyFirebaseUserData(snap.data());
      state.earningsToday = amount;
    }
  }catch(e){
    console.warn('Daily income failed',e);
  }
}

async function processActivationReferralCommission(){
  const fb = window.apexifyFirebase;
  if(!fb || !fb.auth.currentUser) return;

  const uid = fb.auth.currentUser.uid;
  const userRef = fb.doc(fb.db,'users',uid);

  try{
    let rewarded = false;
    let referrerUid = null;
    const commission = Number(firebaseSettings.referralCommission || 15);

    await fb.runTransaction(fb.db, async tx=>{
      const userSnap = await tx.get(userRef);
      if(!userSnap.exists()) return;

      const u=userSnap.data();
      if(u.status !== 'active' || !u.referrerUid || u.referralRewarded === true) return;

      const refRef = fb.doc(fb.db,'users',u.referrerUid);
      const refSnap = await tx.get(refRef);
      if(!refSnap.exists()) return;

      const r=refSnap.data();
      const pubRef = fb.doc(fb.db,'publicProfiles',u.referrerUid);
      const pubSnap = await tx.get(pubRef);

      tx.update(refRef,{
        referralBalance:Number(r.referralBalance||0)+commission,
        mainBalance:Number(r.mainBalance||0)+commission,
        totalRevenue:Number(r.totalRevenue||0)+commission,
        referralCount:Number(r.referralCount||0)+1,
        updatedAt:fb.serverTimestamp()
      });
      tx.update(userRef,{referralRewarded:true, updatedAt:fb.serverTimestamp()});
      if(pubSnap.exists()){
        tx.update(pubRef,{referralCount:Number(pubSnap.data().referralCount||0)+1});
      }
      const notifRef = fb.doc(fb.collection(fb.db,'users',u.referrerUid,'notifications'));
      tx.set(notifRef,{
        title:'নতুন রেফারেল কমিশন',
        body:`আপনি ৳${commission} রেফারেল কমিশন পেয়েছেন`,
        type:'referral', read:false, createdAt:fb.serverTimestamp()
      });
      rewarded=true;
      referrerUid=u.referrerUid;
    });

    if(rewarded){
      await fb.addDoc(fb.collection(fb.db,'transactions'),{
        uid:referrerUid,
        type:'referral',
        title:'রেফারেল কমিশন',
        amount:commission,
        sourceUid:uid,
        createdAt:fb.serverTimestamp()
      });
    }
  }catch(e){
    console.warn('Referral commission failed',e);
  }
}

async function createFirestoreUser(uid, name, phone, referralCode){
  const fb = window.apexifyFirebase;
  let referrerUid = null;

  if(referralCode){
    try{
      const q = fb.query(
        fb.collection(fb.db,'publicProfiles'),
        fb.where('referralId','==',referralCode),
        fb.limit(1)
      );
      const rs = await fb.getDocs(q);
      if(!rs.empty) referrerUid = rs.docs[0].id;
    }catch(e){
      console.warn('Referral lookup failed',e);
    }
  }

  let referralId = makeReferralCode();
  for(let i=0;i<3;i++){
    const q=fb.query(
      fb.collection(fb.db,'publicProfiles'),
      fb.where('referralId','==',referralId),
      fb.limit(1)
    );
    const rs=await fb.getDocs(q);
    if(rs.empty) break;
    referralId=makeReferralCode();
  }

  const userData = {
    uid,
    name,
    phone,
    userId: 'PB-' + uid.slice(0,6).toUpperCase(),
    referralId,
    referrerUid,
    referralRewarded:false,
    status:'inactive',
    activatedAt:null,
    lastDailyCredit:null,
    totalRevenue:0,
    mainBalance:0,
    salaryBalance:0,
    referralBalance:0,
    depositBalance:0,
    referralCount:0,
    completedTaskIds:[],
    bkashNumber:null,
    bkashVerified:false,
    nagadNumber:null,
    nagadVerified:false,
    currency:'BDT',
    createdAt:fb.serverTimestamp(),
    updatedAt:fb.serverTimestamp()
  };

  await fb.setDoc(fb.doc(fb.db,'users',uid), userData);

  // Public, non-sensitive mirror used for referral-code lookup and the leaderboard —
  // keeps balances/phone out of any broadly-queryable collection.
  try{
    await fb.setDoc(fb.doc(fb.db,'publicProfiles',uid), {
      name, userId: userData.userId, referralId, referrerUid, status:'inactive',
      referralCount:0, createdAt:fb.serverTimestamp()
    });
  }catch(e){ console.warn('Public profile creation failed',e); }

  return userData;
}

async function buyPackage(packageId, btn){
  const pkg = state.packages.find(p=>p.id===packageId);
  if(!pkg){ toast('প্যাকেজটি পাওয়া যায়নি'); return; }

  await withButtonLoading(btn, async ()=>{
    const ctx = await ensureReady();
    if(!ctx){ toast('ইন্টারনেট সংযোগ চেক করে আবার চেষ্টা করুন'); return; }
    const {fb, user} = ctx;

    const uid = user.uid;
    const price = Number(pkg.price||0);
    const userRef = fb.doc(fb.db,'users',uid);

    try{
      await fb.runTransaction(fb.db, async tx=>{
        const snap = await tx.get(userRef);
        if(!snap.exists()) throw new Error('no-user');
        const bal = Number(snap.data().depositBalance||0);
        if(bal < price) throw new Error('insufficient');
        tx.update(userRef, {depositBalance: bal-price, updatedAt: fb.serverTimestamp()});
      });
    }catch(e){
      toast(e.message==='insufficient' ? 'পর্যাপ্ত ডিপোজিট ব্যালেন্স নেই' : 'কেনা যায়নি'); return;
    }

    try{
      await fb.addDoc(fb.collection(fb.db,'investmentSubscriptions'),{
        uid, packageId, packageName:pkg.name,
        price, durationDays:Number(pkg.durationDays||0), dailyIncome:Number(pkg.dailyIncome||0),
        status:'active', daysCredited:0, totalCredited:0, lastCreditedDate:null,
        createdAt: fb.serverTimestamp()
      });
      await fb.addDoc(fb.collection(fb.db,'transactions'),{uid, type:'investment', title:`প্যাকেজ কেনা — ${pkg.name}`, amount:-price, createdAt:fb.serverTimestamp()});
      state.user.depositBalance = Number(state.user.depositBalance||0)-price;
      toast('প্যাকেজ কেনা সম্পন্ন হয়েছে');
      await loadUserCollections();
      go('packages');
    }catch(e){
      console.error(e);
      toast('প্যাকেজ তৈরি করা যায়নি, সাপোর্টে যোগাযোগ করুন');
    }
  });
}

async function grantInvestmentIncome(){
  const fb = window.apexifyFirebase;
  if(!fb || !fb.auth.currentUser) return;
  const uid = fb.auth.currentUser.uid;
  const today = new Date().toISOString().slice(0,10);

  try{
    const snap = await fb.getDocs(fb.query(fb.collection(fb.db,'investmentSubscriptions'), fb.where('uid','==',uid), fb.where('status','==','active')));
    for(const s of snap.docs){
      const sub = s.data();
      if(sub.lastCreditedDate === today) continue;
      const daysCredited = Number(sub.daysCredited||0);
      const duration = Number(sub.durationDays||0);
      if(daysCredited >= duration) continue;
      const income = Number(sub.dailyIncome||0);
      const subRef = fb.doc(fb.db,'investmentSubscriptions', s.id);
      const userRef = fb.doc(fb.db,'users', uid);

      await fb.runTransaction(fb.db, async tx=>{
        const uSnap = await tx.get(userRef);
        const sSnap = await tx.get(subRef);
        if(!uSnap.exists() || !sSnap.exists()) return;
        const sd = sSnap.data();
        if(sd.lastCreditedDate === today) return;
        const newDaysCredited = Number(sd.daysCredited||0)+1;
        tx.update(userRef,{
          mainBalance: Number(uSnap.data().mainBalance||0)+income,
          totalRevenue: Number(uSnap.data().totalRevenue||0)+income,
          updatedAt: fb.serverTimestamp()
        });
        tx.update(subRef,{
          daysCredited: newDaysCredited,
          totalCredited: Number(sd.totalCredited||0)+income,
          lastCreditedDate: today,
          status: newDaysCredited >= duration ? 'completed' : 'active'
        });
      });

      await fb.addDoc(fb.collection(fb.db,'transactions'),{
        uid, type:'investment_income', title:`দৈনিক প্যাকেজ আয় — ${sub.packageName||''}`,
        amount:income, createdAt:fb.serverTimestamp()
      });
    }
    const freshSnap = await fb.getDoc(fb.doc(fb.db,'users',uid));
    if(freshSnap.exists()) applyFirebaseUserData(freshSnap.data());
  }catch(e){ console.warn('Investment income crediting failed',e); }
}

// Wraps a button click: disables it, shows a spinner in place of its label,
// runs the async action, then restores the button — regardless of outcome.
// Prevents double-submits and gives instant visual feedback on every action.
async function withButtonLoading(btn, fn){
  if(!btn) { await fn(); return; }
  if(btn.dataset.busy === '1') return;
  btn.dataset.busy = '1';
  const original = btn.innerHTML;
  const origWidth = btn.offsetWidth;
  btn.style.minWidth = origWidth + 'px';
  btn.disabled = true;
  btn.innerHTML = '<span class="btn-spin"></span>';
  try{
    await fn();
  } finally {
    btn.disabled = false;
    btn.innerHTML = original;
    btn.style.minWidth = '';
    btn.dataset.busy = '0';
  }
}

// Waits (quietly, no error toast) for Firebase to finish loading AND for the
// auth session to resolve to a real user. Used by every action button so a
// slow/backgrounded connection just keeps the button spinning instead of
// throwing a premature "please log in" error.
async function ensureReady(maxWaitMs){
  maxWaitMs = maxWaitMs || 30000;
  const fb = await getFB(maxWaitMs);
  if(!fb) return null;
  const user = await getCurrentUser(fb, maxWaitMs);
  if(!user) return null;
  return {fb, user};
}

function getFB(timeoutMs){
  timeoutMs = timeoutMs || 25000;
  if(window.apexifyFirebase) return Promise.resolve(window.apexifyFirebase);
  return new Promise(resolve=>{
    let done=false;
    const onReady = ()=>{ if(done) return; done=true; clearTimeout(t); resolve(window.apexifyFirebase); };
    window.addEventListener('apexify-fb-ready', onReady, {once:true});
    const t = setTimeout(()=>{
      if(done) return; done=true;
      window.removeEventListener('apexify-fb-ready', onReady);
      resolve(window.apexifyFirebase || null);
    }, timeoutMs);
  });
}
function getCurrentUser(fb, timeoutMs){
  timeoutMs = timeoutMs || 10000;
  return new Promise(resolve=>{
    if(fb.auth.currentUser){ resolve(fb.auth.currentUser); return; }
    let done=false;
    const unsub = fb.onAuthStateChanged(fb.auth, user=>{
      if(done) return; done=true;
      try{ unsub(); }catch(e){}
      if(!user) console.warn('[Apexify] getCurrentUser: onAuthStateChanged fired with no user — session appears lost.');
      resolve(user);
    });
    setTimeout(()=>{
      if(done) return; done=true;
      try{ unsub(); }catch(e){}
      const fallback = fb.auth.currentUser || null;
      if(!fallback) console.warn('[Apexify] getCurrentUser: timed out after '+timeoutMs+'ms with no user — Firebase Auth never resolved a session.');
      resolve(fallback);
    }, timeoutMs);
  });
}
function toast(msg){
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = `${iconCheck()}<span>${msg}</span>`;
  document.getElementById('modal-root').appendChild(t);
  setTimeout(()=>t.remove(), 2200);
}

async function submitPasswordResetRequest(btn){
  const phone = normalizePhone(document.getElementById('fp-phone').value.trim());
  const note = document.getElementById('fp-note').value.trim();
  const err = document.getElementById('fp-err');
  if(!/^01[0-9]{9}$/.test(phone)){ err.textContent='সঠিক ১১ ডিজিটের নম্বর দিন'; return; }
  err.textContent='';

  await withButtonLoading(btn, async ()=>{
    const fb = await getFB(30000);
    if(!fb){ err.textContent='ইন্টারনেট সংযোগ চেক করে আবার চেষ্টা করুন'; return; }
    try{
      await fb.addDoc(fb.collection(fb.db,'passwordResetRequests'), {
        phone, note, status:'pending', createdAt: fb.serverTimestamp()
      });
      closeModal();
      toast('রিকোয়েস্ট পাঠানো হয়েছে, শীঘ্রই যোগাযোগ করা হবে');
    }catch(e){
      console.error(e);
      err.textContent='পাঠানো যায়নি, আবার চেষ্টা করুন';
    }
  });
}

async function doLogin(btn){
  const phone = normalizePhone(document.getElementById('login-phone').value.trim());
  const pass = document.getElementById('login-pass').value.trim();
  const err = document.getElementById('login-err');

  if(!phone || !pass){ err.textContent = 'মোবাইল নম্বর ও পাসওয়ার্ড দিন'; return; }
  err.textContent='';

  await withButtonLoading(btn, async ()=>{
    const fb = await getFB(30000);
    if(!fb){ err.textContent='ইন্টারনেট সংযোগ চেক করে আবার চেষ্টা করুন'; return; }

    try{
      await fb.signInWithEmailAndPassword(fb.auth, phoneAuthEmail(phone), pass);
      if(!await loadCurrentUser()){
        await fb.signOut(fb.auth);
        return;
      }
      document.getElementById('auth-screen').classList.add('hidden');
      document.getElementById('app-shell').classList.remove('hidden');
      go('home');
      toast('সফলভাবে লগইন হয়েছে');
    }catch(e){
      console.error(e);
      err.textContent = e.code==='auth/invalid-credential'
        ? 'মোবাইল নম্বর বা পাসওয়ার্ড ভুল'
        : (e.code==='auth/user-not-found' ? 'এই নম্বরে কোনো অ্যাকাউন্ট নেই' : 'লগইন করা যায়নি');
    }
  });
}

async function doRegister(btn){
  const name=document.getElementById('reg-name').value.trim();
  const phone=normalizePhone(document.getElementById('reg-phone').value.trim());
  const referral=(document.getElementById('reg-referral').value.trim() || getReferralFromUrl()).toUpperCase();
  const pass=document.getElementById('reg-pass').value;
  const pass2=document.getElementById('reg-pass2').value;

  if(!name || !phone || !pass || !pass2){
    toast('সব তথ্য পূরণ করুন'); return;
  }

  // Bangladesh mobile validation for this phone-as-login system.
  if(!/^01[3-9]\d{8}$/.test(phone)){
    toast('সঠিক ১১ সংখ্যার মোবাইল নম্বর দিন'); return;
  }

  if(pass.length < 6){
    toast('পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের দিন'); return;
  }

  if(pass !== pass2){
    toast('দুইটি পাসওয়ার্ড একই নয়'); return;
  }

  const fb = await getFB(30000);
  if(!fb){ toast('ইন্টারনেট সংযোগ চেক করে আবার চেষ্টা করুন'); return; }

  await withButtonLoading(btn, async ()=>{
    const authEmail=phoneAuthEmail(phone);
    let createdUser=null;

    try{
      // Firebase Authentication account.
      const cred=await fb.createUserWithEmailAndPassword(
        fb.auth,
        authEmail,
        pass
      );
      createdUser=cred.user;

      // Firestore profile. If this fails, roll back the Auth account so the
      // next attempt does not get stuck with "email-already-in-use".
      await createFirestoreUser(createdUser.uid,name,phone,referral);

      state.user={
        ...state.user,
        name,
        phone,
        userId:'PB-'+createdUser.uid.slice(0,6).toUpperCase(),
        referralId:'',
        status:'inactive',
        totalRevenue:0,
        mainBalance:0,
        salaryBalance:0,
        referralBalance:0,
        depositBalance:0,
        avatarInitial:name[0]
      };

      await fb.signOut(fb.auth);

      toast('অ্যাকাউন্ট তৈরি হয়েছে — এখন লগইন করুন');
      document.getElementById('login-phone').value=phone;
      document.getElementById('login-pass').value='';
      switchAuth('login');

    }catch(e){
      console.error('Apexify registration error:', e);

      // Roll back a newly-created Auth user when Firestore setup fails.
      if(createdUser){
        try{
          if(fb.auth.currentUser && fb.auth.currentUser.uid===createdUser.uid){
            await fb.deleteUser(createdUser);
          }
        }catch(rollbackError){
          console.error('Auth rollback failed:', rollbackError);
        }
      }

      const code=e?.code || '';

      const messages={
        'auth/email-already-in-use':'এই মোবাইল নম্বর দিয়ে আগে থেকেই অ্যাকাউন্ট আছে',
        'auth/invalid-email':'মোবাইল নম্বরের লগইন আইডি তৈরি করা যায়নি',
        'auth/weak-password':'পাসওয়ার্ড আরও শক্তিশালী দিন (কমপক্ষে ৬ অক্ষর)',
        'auth/operation-not-allowed':'Firebase Console-এ Email/Password Sign-in চালু করা নেই',
        'auth/network-request-failed':'ইন্টারনেট/Firebase নেটওয়ার্ক সংযোগ সমস্যা',
        'auth/api-key-not-valid.-please-pass-a-valid-api-key.':'Firebase API Key অবৈধ। Firebase Console-এর বর্তমান Web App config থেকে apiKey মিলিয়ে নিন',
        'auth/api-key-not-valid':'Firebase API Key অবৈধ। Firebase Console-এর বর্তমান Web App config থেকে apiKey মিলিয়ে নিন',
        'auth/too-many-requests':'অনেকবার চেষ্টা হয়েছে। কিছুক্ষণ পরে আবার চেষ্টা করুন',
        'permission-denied':'Firestore Rules রেজিস্ট্রেশন ব্লক করছে',
        'failed-precondition':'Firestore Database/Rules configuration পরীক্ষা করুন',
        'unavailable':'Firestore সাময়িকভাবে unavailable'
      };

      toast(messages[code] || `রেজিস্ট্রেশন ব্যর্থ: ${code || 'অজানা Firebase error'}`);

      // Keep the exact technical error visible in the browser console.
      console.error('Firebase error code:', code);
      console.error('Firebase error message:', e?.message || e);
    }
  });
}

async function logout(){
  const fb = await getFB();
  try{ if(fb?.auth) await fb.signOut(fb.auth); }catch(e){ console.warn(e); }
  if(firebaseUnsubUser) { firebaseUnsubUser(); firebaseUnsubUser=null; }
  document.getElementById('app-shell').classList.add('hidden');
  document.getElementById('auth-screen').classList.remove('hidden');
  switchAuth('login');
}

async function submitRedeem(btn){
  const codeRaw = document.getElementById('redeem-code').value.trim();
  const err = document.getElementById('redeem-err');
  if(!codeRaw){ err.textContent = 'কোড লিখুন'; return; }

  await withButtonLoading(btn, async ()=>{
    const ctx = await ensureReady();
    if(!ctx){ err.textContent = 'ইন্টারনেট সংযোগ চেক করে আবার চেষ্টা করুন'; return; }
    const {fb, user} = ctx;
    const code = codeRaw.toUpperCase();
    const uid = user.uid;
    err.textContent = '';

    try{
      const dupSnap = await fb.getDocs(fb.query(
        fb.collection(fb.db,'redemptions'), fb.where('uid','==',uid), fb.where('code','==',code), fb.limit(1)
      ));
      if(!dupSnap.empty){ err.textContent = 'এই কোডটি আপনি আগেই ব্যবহার করেছেন'; return; }

      const codeRef = fb.doc(fb.db,'redeemCodes',code);
      let amount = 0;
      await fb.runTransaction(fb.db, async tx=>{
        const snap = await tx.get(codeRef);
        if(!snap.exists()) throw new Error('invalid');
        const d = snap.data();
        if(d.active===false) throw new Error('inactive');
        if(d.expiresAt?.toDate && d.expiresAt.toDate() < new Date()) throw new Error('expired');
        if(typeof d.maxUses==='number' && Number(d.usedCount||0) >= d.maxUses) throw new Error('limit');
        amount = Number(d.amount||0);
        const userRef = fb.doc(fb.db,'users',uid);
        const uSnap = await tx.get(userRef);
        const u = uSnap.data();

        tx.update(codeRef,{usedCount:Number(d.usedCount||0)+1});
        tx.update(userRef,{
          mainBalance:Number(u.mainBalance||0)+amount,
          totalRevenue:Number(u.totalRevenue||0)+amount,
          updatedAt:fb.serverTimestamp()
        });
      });
      await fb.addDoc(fb.collection(fb.db,'redemptions'),{uid, code, amount, createdAt:fb.serverTimestamp()});
      await fb.addDoc(fb.collection(fb.db,'transactions'),{uid, type:'redeem', title:'রিডিম কোড', amount, createdAt:fb.serverTimestamp()});
      state.user.mainBalance = Number(state.user.mainBalance||0)+amount;
      state.user.totalRevenue = Number(state.user.totalRevenue||0)+amount;
      document.getElementById('redeem-code').value='';
      toast(`কোড সফলভাবে ক্লেইম হয়েছে, ৳${fmt(amount)} যোগ হয়েছে`);
      go('redeem');
    }catch(e){
      const map = {invalid:'কোডটি সঠিক নয়', inactive:'এই কোডটি বন্ধ রয়েছে', expired:'কোডের মেয়াদ শেষ হয়ে গেছে', limit:'কোডের ব্যবহার সীমা শেষ হয়ে গেছে'};
      err.textContent = map[e.message] || 'কোড ব্যবহার করা যায়নি';
    }
  });
}

async function submitWithdraw(btn){
  const amt = Number(document.getElementById('withdraw-amt').value);
  const minWd = Number(firebaseSettings.minWithdraw || 100);
  const maxWd = Number(firebaseSettings.maxWithdraw || 20000);
  if(!amt || amt < minWd){ toast(`সর্বনিম্ন ৳${fmt(minWd)} উইথড্র করা যাবে`); return; }
  if(amt > maxWd){ toast(`সর্বোচ্চ ৳${fmt(maxWd)} উইথড্র করা যাবে`); return; }
  if(!state.user.bkashNumber && !state.user.nagadNumber){ toast('আগে একটি ওয়ালেট যুক্ত করুন'); return; }

  await withButtonLoading(btn, async ()=>{
    const ctx = await ensureReady();
    if(!ctx){ toast('ইন্টারনেট সংযোগ চেক করে আবার চেষ্টা করুন'); return; }
    const {fb, user} = ctx;

    const uid = user.uid;
    let walletType, walletNumber;
    if(state.user.bkashNumber && state.user.nagadNumber){
      const choice = document.getElementById('withdraw-wallet-choice').value;
      walletType = choice==='bkash' ? 'bKash' : 'Nagad';
      walletNumber = choice==='bkash' ? state.user.bkashNumber : state.user.nagadNumber;
    }else if(state.user.bkashNumber){
      walletType = 'bKash'; walletNumber = state.user.bkashNumber;
    }else{
      walletType = 'Nagad'; walletNumber = state.user.nagadNumber;
    }
    const fee = Math.round(amt*0.02);
    const net = amt-fee;
    const userRef = fb.doc(fb.db,'users',uid);

    try{
      await fb.runTransaction(fb.db, async tx=>{
        const snap = await tx.get(userRef);
        if(!snap.exists()) throw new Error('no-user');
        const bal = Number(snap.data().mainBalance||0);
        if(bal < amt) throw new Error('insufficient');
        tx.update(userRef,{mainBalance: bal-amt, updatedAt: fb.serverTimestamp()});
      });
    }catch(e){
      toast(e.message==='insufficient' ? 'পর্যাপ্ত ব্যালেন্স নেই' : 'রিকোয়েস্ট ব্যর্থ হয়েছে');
      return;
    }

    try{
      await fb.addDoc(fb.collection(fb.db,'withdrawalRequests'),{
        uid, amount:amt, fee, netAmount:net,
        walletType, walletNumber,
        status:'pending', createdAt:fb.serverTimestamp()
      });
      state.user.mainBalance = Number(state.user.mainBalance||0)-amt;
      toast('উইথড্র রিকোয়েস্ট পাঠানো হয়েছে');
      await loadUserCollections();
      go('withdraw');
    }catch(e){
      console.error(e);
      toast('রিকোয়েস্ট সংরক্ষণ ব্যর্থ হয়েছে, সাপোর্টে যোগাযোগ করুন');
    }
  });
}

async function setWalletNumber(key, btn){
  const input = document.getElementById('wallet-input-'+key);
  const num = input.value.trim();
  if(!/^01[0-9]{9}$/.test(num)){ toast('সঠিক ১১ ডিজিটের নম্বর দিন (01 দিয়ে শুরু)'); return; }
  if(state.user[key+'Number']){ toast('এই নম্বর ইতিমধ্যে সেট করা আছে, পরিবর্তন করা যাবে না'); go('wallet'); return; }

  await withButtonLoading(btn, async ()=>{
    const ctx = await ensureReady();
    if(!ctx){ toast('ইন্টারনেট সংযোগ চেক করে আবার চেষ্টা করুন'); return; }
    const {fb, user} = ctx;
    try{
      await fb.updateDoc(fb.doc(fb.db,'users',user.uid), {
        [key+'Number']: num,
        [key+'Verified']: false,
        updatedAt: fb.serverTimestamp()
      });
      state.user[key+'Number'] = num;
      state.user[key+'Verified'] = false;
      go('wallet');
      toast('নম্বর যুক্ত হয়েছে, যাচাই চলছে');
    }catch(e){
      console.error(e);
      toast('যুক্ত করা যায়নি, আবার চেষ্টা করুন');
    }
  });
}

async function submitTaskProof(taskId, btn){
  const proof = document.getElementById('task-proof').value.trim();
  const err = document.getElementById('task-submit-err');
  if(!proof){ err.textContent='প্রমাণ/নোট লিখুন'; return; }
  err.textContent='';

  const t = state.tasks.find(x=>x.id===taskId);
  if(!t){ toast('টাস্কটি পাওয়া যায়নি'); return; }

  await withButtonLoading(btn, async ()=>{
    const ctx = await ensureReady();
    if(!ctx){ err.textContent='ইন্টারনেট সংযোগ চেক করে আবার চেষ্টা করুন'; return; }
    const {fb, user} = ctx;

    try{
      const dupSnap = await fb.getDocs(fb.query(
        fb.collection(fb.db,'taskSubmissions'), fb.where('uid','==',user.uid), fb.where('taskId','==',taskId), fb.limit(1)
      ));
      if(!dupSnap.empty && dupSnap.docs[0].data().status!=='rejected'){
        err.textContent='এই টাস্কটি ইতিমধ্যে জমা দেওয়া হয়েছে'; return;
      }

      await fb.addDoc(fb.collection(fb.db,'taskSubmissions'),{
        uid:user.uid, taskId, taskTitle:t.title, reward:Number(t.reward||0),
        proof, status:'pending', createdAt:fb.serverTimestamp()
      });
      toast('টাস্ক জমা দেওয়া হয়েছে, এডমিন যাচাই করছে');
      closeModal();
      await loadUserCollections();
      go('task');
    }catch(e){
      console.error(e);
      err.textContent='জমা দেওয়া যায়নি, আবার চেষ্টা করুন';
    }
  });
}

      <p class="plan-note">শুধু সত্যিকারের লেনদেনের Transaction ID দিন। যাচাই না হওয়া পর্যন্ত টাকা ব্যালেন্সে যোগ হবে না।</p>
    </div>
  </div>`);
}

function copyDepositNumber(num){
  navigator.clipboard?.writeText(num).then(()=>toast('পেমেন্ট নম্বর কপি হয়েছে')).catch(()=>toast(num));
}

async function submitDeposit(btn){
  const amount = Number(document.getElementById('deposit-amount')?.value || 0);
  const txid = document.getElementById('deposit-txid')?.value.trim();
  const sender = document.getElementById('deposit-sender')?.value.trim();
  const method = document.getElementById('deposit-method')?.value;
  const err = document.getElementById('deposit-err');

  if(!amount || amount < 1){ err.textContent='ডিপোজিটের পরিমাণ দিন'; return; }
  const minDep = Number(firebaseSettings.minDeposit || 50);
  const maxDep = Number(firebaseSettings.maxDeposit || 50000);
  if(amount < minDep){ err.textContent=`সর্বনিম্ন ৳${fmt(minDep)} ডিপোজিট করা যাবে`; return; }
  if(amount > maxDep){ err.textContent=`সর্বোচ্চ ৳${fmt(maxDep)} ডিপোজিট করা যাবে`; return; }
  if(!txid){ err.textContent='Transaction ID দিন'; return; }
  if(!sender){ err.textContent='যে নম্বর থেকে টাকা পাঠিয়েছেন সেটি দিন'; return; }

  err.textContent='';
  await withButtonLoading(btn, async ()=>{
    const ctx = await ensureReady();
    if(!ctx){ err.textContent='ইন্টারনেট সংযোগ চেক করে আবার চেষ্টা করুন'; return; }
    const {fb, user} = ctx;
    try{
      const uid = user.uid;
      await fb.addDoc(fb.collection(fb.db,'depositRequests'),{
        uid,
        method,
        receiverNumber: method==='bKash' ? '01403594918' : '01403593914',
        amount,
        transactionId:txid,
        senderNumber:sender,
        status:'pending',
        createdAt:fb.serverTimestamp()
      });
      closeModal();
      toast('ডিপোজিট রিকোয়েস্ট জমা হয়েছে। যাচাইয়ের পর ব্যালেন্স যোগ হবে');
    }catch(e){
      console.error(e);
      err.textContent='রিকোয়েস্ট জমা দেওয়া যায়নি। আবার চেষ্টা করুন';
    }
  });
}

async function updateStatus(newStatus){
  state.user.status = newStatus;
  await persistStatus();
}

async function saveProfile(){
  const name = document.getElementById('edit-name').value.trim();
  if(!name){ toast('নাম দিন'); return; }
  try{
    state.user.name = name;
    state.user.avatarInitial = name[0];
    await saveUserPatch({name});
    closeModal();
    go('profile');
    toast('প্রোফাইল আপডেট হয়েছে');
  }catch(e){
    console.error(e);
    toast('প্রোফাইল আপডেট করা যায়নি');
  }
}

/* Init: start on login */
switchAuth('login');

(async function initFirebaseSession(){
  if(!window.apexifyFirebase){
    await new Promise(resolve => window.addEventListener('apexify-fb-ready', resolve, {once:true}));
  }
  const fb=window.apexifyFirebase;
  if(!fb) return;

  try{
    await loadFirebaseSettings();

    fb.onAuthStateChanged(fb.auth, async user=>{
      if(!user) return;
      try{
        const ok=await loadCurrentUser();
        if(ok){
          document.getElementById('auth-screen').classList.add('hidden');
          document.getElementById('app-shell').classList.remove('hidden');
          go('home');
        }
      }catch(e){
        console.error('Session restore failed',e);
      }
    });
  }catch(e){
    console.error('Firebase init failed',e);
  }

  const ref=getReferralFromUrl();
  const refInput=document.getElementById('reg-referral');
  if(ref && refInput) refInput.value=ref;
})();
</script>

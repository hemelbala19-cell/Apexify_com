<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apexify - Reach The Peak</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-body">
    <div class="auth-container" style="text-align: center; max-width: 400px; margin: 50px auto; padding: 25px; background: white; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">
        <!-- লোগো এবং স্বাগত বার্তা -->
        <div class="auth-header" style="margin-bottom: 25px;">
            <img src="images/logo.png" alt="Apexify Logo" style="max-width: 120px; height: auto; margin-bottom: 15px;">
            <h2 style="color: #1F2937; font-size: 24px; margin-bottom: 5px;">Welcome to Apexify</h2>
            <p style="color: #4F46E5; font-weight: 600; font-size: 14px; margin: 0;">Reach The Peak</p>
        </div>
        
        <!-- নেভিগেশন বাটন -->
        <div style="display: flex; flex-direction: column; gap: 12px;">
            <a href="login.html" style="display: block; width: 100%; padding: 12px; background-color: #4F46E5; color: white; text-decoration: none; border-radius: 6px; font-weight: bold; font-size: 16px; box-sizing: border-box; text-align: center;">Login</a>
            
            <a href="register.html" style="display: block; width: 100%; padding: 12px; background-color: #1F2937; color: white; text-decoration: none; border-radius: 6px; font-weight: bold; font-size: 16px; box-sizing: border-box; text-align: center;">Register</a>
        </div>
    </div>
</body>
</html>

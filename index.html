<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apexify - Welcome</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-body">
    <div class="auth-container" style="text-align: center; max-width: 400px; margin: 80px auto; padding: 20px;">
        <div class="auth-header" style="margin-bottom: 30px;">
            <h2>Apexify Platform</h2>
            <p style="color: #6B7280; margin-top: 10px;">Please choose an option to continue</p>
        </div>
        
        <!-- সঠিকভাবে লিংকযুক্ত বাটন -->
        <div style="display: flex; flex-direction: column; gap: 15px;">
            <a href="login.html" style="display: block; width: 100%; padding: 14px; background-color: #4F46E5; color: white; text-decoration: none; border-radius: 6px; font-weight: bold; font-size: 16px; box-sizing: border-box; text-align: center;">Login</a>
            
            <a href="register.html" style="display: block; width: 100%; padding: 14px; background-color: #1F2937; color: white; text-decoration: none; border-radius: 6px; font-weight: bold; font-size: 16px; box-sizing: border-box; text-align: center;">Register</a>
        </div>
    </div>
